# ms-stack-cube: ManiSkill3 state observations, horizon 25, env built by env/maniskill_env.py.
# FB_DATA_ROOT points at the data root holding data/<family>/<task>.npz. No goal-in-obs layout
# is registered for this task (env/unified.py::_GOAL_LAYOUT), so goal-conditioned eval uses
# the default fixed goal (the highest-reward next observation in the data).
adapter: unified
env_name: ms-stack-cube          # run naming only
task: ms-stack-cube
data_path: ${oc.env:FB_DATA_ROOT}/data/maniskill/ms-stack-cube.npz
