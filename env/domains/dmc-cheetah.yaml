# ExoRL cheetah, RND exploration data, reward-specified tasks scored by episode return.
# goal_spec is passed by scripts/launch_exorl_*.sh, calibrated by scripts/calibrate_goal_spec.py.
adapter: unified
env_name: dmc-cheetah         # run naming only
task: dmc-cheetah
exorl_task: run               # one of run / run_backward / flip / flip_backward
exorl_algo: rnd
data_dir: ${oc.env:EXORL_DATA_ROOT,${oc.env:HOME}/exorl_data/exorl/datasets}/cheetah/rnd
exorl_max_episodes: 5000      # 5M transitions
keep_dataset_rewards: true    # keep the task reward
