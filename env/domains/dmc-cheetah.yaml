# ExoRL cheetah (RND exploration buffer). Reward-specified: no binary success rule; eval
# reports undiscounted `episode_return`. `run` is the dm_control suite task; run_backward /
# flip / flip_backward are ExoRL additions (env/exorl_dmc_tasks).
#
# The density critics need the hit spec (which observation columns count as reaching a state,
# and within what radius) for this layout. It is passed as an override because the critic yaml
# merges after the domain (quote it: a bare a:b:c parses as a sexagesimal number), e.g.
#     --override 'measure_hit_spec="<a:b:radius>"'
# with the value the ExoRL launchers pass (scripts/launch_exorl_*.sh). Radii are calibrated so
# the fraction of random observation pairs inside the ball matches cube-single's hit rate
# under 19:22:0.4 (scripts/calibrate_hit_spec.py).
adapter: unified
env_name: dmc-cheetah         # run naming only
task: dmc-cheetah
exorl_task: run               # one of run / run_backward / flip / flip_backward
exorl_algo: rnd
data_dir: ${oc.env:EXORL_DATA_ROOT,${oc.env:HOME}/exorl_data/exorl/datasets}/cheetah/rnd
exorl_max_episodes: 5000      # 5M transitions, as in MetaMotivo's ExoRL setting
keep_dataset_rewards: true    # keep the task reward instead of the goal-reaching reward
