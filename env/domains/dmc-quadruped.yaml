# ExoRL quadruped (RND exploration buffer). Reward-specified: no binary success rule; eval
# reports `episode_return`. obs 78 / act 12, episode length 1000. `stand` and `jump` are
# ExoRL custom tasks vendored in env/exorl_dmc_tasks/quadruped.{py,xml}; `walk` and `run`
# come from the dm_control suite.
#
# Hit spec for this layout: passed as an override (quote it), with the value the ExoRL
# launchers pass (scripts/launch_exorl_*.sh); see dmc-cheetah.yaml.
adapter: unified
env_name: dmc-quadruped        # run naming only
task: dmc-quadruped
exorl_task: walk               # one of stand / walk / run / jump
exorl_algo: rnd
data_dir: ${oc.env:EXORL_DATA_ROOT,${oc.env:HOME}/exorl_data/exorl/datasets}/quadruped/rnd
exorl_max_episodes: 5000
keep_dataset_rewards: true
