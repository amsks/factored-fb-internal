# mw-pick-place via the unified adapter. Regime-selectable: FB_DATA_ROOT points at the data root for
# a given data_type (expert / play-noise / play-resample), each holding data/<family>/<env>.npz.
# The env is built by the metaworld backend; obs/action layout matches the packed dataset.
adapter: unified
env_name: mw-pick-place          # run naming only
task: mw-pick-place
data_path: ${oc.env:FB_DATA_ROOT}/data/metaworld/mw-pick-place.npz
render: false
