# ExoRL walker (RND exploration buffer). Reward-specified: no binary success rule; eval
# reports undiscounted `episode_return`.
#
# Hit spec for this layout, passed as an override (quote it):
#     --override 'goal_spec="0:24:15.9"'
# The block is the full observation (orientations 0:14, height 14:15, velocities 15:24). The
# radius is calibrated so the fraction of random observation pairs inside the ball matches
# cube-single's hit rate under 19:22:0.4 (scripts/calibrate_hit_spec.py); it is dominated by
# the unnormalised velocity dims.
adapter: unified
env_name: dmc-walker          # run naming only
task: dmc-walker
exorl_task: walk              # one of stand / walk / run / flip
exorl_algo: rnd
data_dir: ${oc.env:EXORL_DATA_ROOT,${oc.env:HOME}/exorl_data/exorl/datasets}/walker/rnd
exorl_max_episodes: 5000      # 5M transitions, as in MetaMotivo's ExoRL setting
keep_dataset_rewards: true    # keep the task reward instead of the goal-reaching reward
