# ExoRL point_mass_maze (RND exploration buffer). Reward-specified: the task is a reward
# function (`exorl_task`), not a goal. GCDataset replaces `rewards` with its goal-reaching
# reward, so `keep_dataset_rewards: true` is what hands the density critics the task reward
# for reward-weighted task inference.
#
# Hit spec for this layout, passed as an override (quote it):
#     --override 'goal_spec="0:2:0.03"'
# 0:2 is the (x, y) block of the [x, y, vx, vy] observation; 0.03 is the maze's target size.
adapter: unified
env_name: dmc-point-mass-maze     # run naming only
task: dmc-point-mass-maze
exorl_task: reach_top_left        # one of reach_{top,bottom}_{left,right}
exorl_algo: rnd
data_dir: ${oc.env:EXORL_DATA_ROOT,${oc.env:HOME}/exorl_data/exorl/datasets}/point_mass_maze/rnd
# Relabelling costs one mujoco set_state + get_reward per stored state, cached under
# $EXORL_CACHE_ROOT. 5000 episodes = 5M transitions, as in MetaMotivo's ExoRL setting.
exorl_max_episodes: 5000
keep_dataset_rewards: true
