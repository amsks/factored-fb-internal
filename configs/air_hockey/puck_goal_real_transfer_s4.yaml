# Derived from sysid_best_params.yaml — hist_len=4 + hist4 paddle sysid fit.
# Paddle PID/density from windowed-10 grid search (2026-05-21):
#   sysid/teleop_hist4/system_id/grid_search_results_3d_fine_windowed_10/
#   grid_search_3d_fine_windowed_refine_results.json  →  kp=7500, kd=50, ki=0, density=3500
# See _filter_update() in airhockey/sims/airhockey_box2d.py (hist_len=4 smoothing).

air_hockey:
  diagonal_motion_rew: 0.0
  direction_change_rew: 0.0
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  horizontal_vel_rew: 0.0
  max_timesteps: 250
  n_training_steps: 1000000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  return_goal_obs: false
  seed: 0

  puck_spawn_near_paddle_prob: 0.15
  puck_near_paddle_offset_min_m: 0.025
  puck_near_paddle_offset_max_m: 0.05
  puck_near_paddle_horizontal_std_m: 0.015
  puck_near_paddle_speed_min_m_s: 0.0
  puck_near_paddle_speed_max_m_s: 0.2

  puck_linear_top_spawn_goal_cutoff_x: null
  puck_linear_top_spawn_center_cutoff_x: 0.2
  puck_linear_top_spawn_speed_min: 0.0
  puck_linear_top_spawn_speed_max: 0.5
  # ----- Physics-parameter randomization (the actual knob this run tests) -----
  domain_random: true
  random_variables: [paddle_density, puck_damping, gravity]
  random_variable_ranges:
    paddle_density: [2250.0, 50.0]   # sysid 3000, ±25%
    puck_damping:   [0.1335, 0.2225]   # sysid 0.178, ±25%
    gravity:        [-0.826, -0.496]   # sysid -0.661, ±25% (more-negative = stronger pull)

  simulator: box2d
  simulator_params:
    absorb_target: false
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.0508
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3500
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    # Restitution reverted to the v1 (latest_model/hist2_motion0/) values so
    # the v1→v2 difference is purely the collision-randomization knobs below,
    # not the bounce coefficients. See 2026-05-05 zero-shot-ablations decision.
    puck_restitution: 1.09145
    paddle_restitution: 1.0
    side_wall_restitution: 0.99
    end_wall_restitution: 0.7
    wall_bounce_scale: 0.02
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    use_pid: true
    pid_kp: 7500
    pid_kd: 50
    pid_ki: 0.0

    hist_len: 4

    puck_noise: true
    puck_noise_std: 0.01
    # Plain spatially-uniform puck occlusion: 5% per-step probability to start
    # a new occlusion run anywhere on the table; run length sampled from the
    # weights below (max 7 consecutive occluded frames).
    enable_random_occlusions: true
    random_occlusion_rate: 0.05
    random_occlusion_length_weights: [75, 39, 18, 9, 4, 2, 1]
    enable_action_delay: false
    enable_observation_delay: true
    delay_seconds: 0.025

  stand_still_rew: 0.01
  task: puck_goal_position
  randomize_paddle_spawn: true
  base_goal_radius: 0.06
  puck_goal_success_bonus: 0.0
  paddle_puck_success_bonus: 0.0
  terminate_on_enemy_goal: false
  terminate_on_out_of_bounds: true
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  truncate_rew: -1
  wall_bumping_rew: -1
algorithm: ppo
eval_freq: 5000
gamma: 0.99
model_save_filepath: model
n_eval_eps: 30
n_threads: 1
n_training_steps: 1000000
print_reward: false
seed:
- 0
- 1
- 2
- 3
- 4
tb_log_dir: baseline_models
tb_log_name: air_hockey_agent
vec_normalize_save_filepath: vec_normalize.pkl
