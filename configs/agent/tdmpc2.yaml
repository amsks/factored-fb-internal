# @package _global_
defaults:
  - _self_

agent: tdmpc2
horizon: 3                 # buffer window length == TD-MPC2 planning horizon

tdmpc2:
  random_goal_ratio: 0.5
  success_threshold: 0.04
  # TD-MPC2 hyperparameters (override build_tdmpc2_cfg defaults here if needed)
  latent_dim: 512
  mlp_dim: 512
  num_q: 5
  horizon: 3
  num_samples: 512
  num_elites: 64
  num_pi_trajs: 24
  iterations: 6
  episode_length: 200
