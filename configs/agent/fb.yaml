# @package _global_
agent: fb
# core hyperparameters (override on CLI with `lr_b=1e-5` etc.)
z_dim: 50
L_dim: 50
actor_encode_obs: false
discount: 0.99
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
weight_decay: 0.0
clip_grad_norm: 0.0
ortho_coef: 1.0
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
actor_pessimism_penalty: 0.0
actor_std: 0.2
stddev_clip: 0.3
f_target_tau: 0.005
b_target_tau: 0.005
bc_coeff: 0.0            # 0 for plain FB; td_jepa sets 0.3 on antmaze, 3.0 on cube via FBFlowBCAgent
q_loss_coef: 0.0         # td_jepa's optional aux Q-MSE loss (off by default)
# Experiment B: coverage-balanced (goal-agnostic) reweight of the FB diagonal term.
reweight_alpha: 0.0                          # 0 = off (current FB exactly); try 0.25, 0.5
reweight_clip: 10.0                          # per-sample weight cap (clamped to [1/clip, clip])
reweight_density_path: analysis/cube_density.npz
reweight_mode: coverage                      # coverage = inverse cube-density; interaction = IWR contact bump (spec 2026-06-11)
iwr_c: 0.03                                  # contact distance, obs frame (median hand-cube d of grasped states)
iwr_sigma: 0.05                              # interaction window (grasped p95 ~ 0.067)
iwr_eps: 0.1                                 # coverage floor (rho' > 0 on all of rho's support)
weight_diag: false                          # false = pure rho'-FB (diagonal unweighted); true = coverage-PRIORITIZED
weight_z: false                             # true = resample goal-derived z by w (rare-goal exposure for F/actor)
train_goal_mode: perm                       # perm = uniform buffer goals (original); traj = zHER (z = B(own trajectory future))
decouple_actor_z: false                     # GCIQL-style: critic keeps broad z, actor trains on B(on-traj future) only (measure mode)
critic_mode: measure                        # measure = stock FB; iql = goal-conditioned expectile critic on F.z (needs train_goal_mode=traj)
iql_expectile: 0.9                          # IQL expectile (matches GCIQL)
iql_thresh: 0.04                            # goal-reaching reward radius (cube xyz, world m)
onestep: false                              # true = one-step FB (F not z-conditioned + SARSA next-action; behavior successor)
onestep_z_cond: false                       # T8: with onestep=true, KEEP F z-conditioned (Zheng-faithful reading); only swaps the target action
decondition_F: false                        # true = zeros to F's task slot => phi(s,a) task-agnostic (bilinear-GCIQL direction)
d_norm: false                               # true = scale bilinear value F.z by 1/sqrt(z_dim) (GCIQL's phi.psi/sqrt(d))
bilinear_v: false                           # true = FB-IQL value head V=<phi_V(s),z>/sqrt(d) (matches Q) instead of MLP([s,z])
critic_goal_mix: [1.0, 0.0, 0.0]            # IQL value-goal mix [p_traj, p_cur, p_random] (GCIQL=[0.5,0.2,0.3]); needs iql_reward=goal_match
actor_goal_mix: [1.0, 0.0, 0.0]             # IQL actor-goal mix [p_traj, p_cur, p_random] (GCIQL=[1,0,0] traj-only)
iql_reward: cube_xyz                         # cube_xyz (privileged thresh) | goal_match (GCIQL: success = goal is current state)
goal_cond: false        # V1: feed the explicit goal obs into forward map + actor
fixed_b: none           # V2: 'none' (learned B) | 'cube_xyz' (USFA, z_dim->3) | 'identity' (z=g, B=I, norm_z off) | 'identity_norm' (B=I but z=sqrt(d)*g/||g||)
amp: false

# Per-network architecture (td_jepa OGBench launch defaults)
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  num_parallel: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
actor:
  name: simple
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
