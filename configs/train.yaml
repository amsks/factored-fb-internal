defaults:
  - _self_
  - domain: antmaze_medium
  - agent: fb
  - override hydra/launcher: basic

domain: antmaze-medium-navigate-v0
obs_type: state                    # state | pixels
n_transitions: null                # null = load full dataset

num_train_steps: 1_000_000
batch_size: 256
eval_every: 50_000
log_every: 1_000
save_every: 200_000
seed: 42
device: cuda

# architecture
z_dim: 50
hidden_dim: 1024                   # used for F and actor (matches metamotivo)
n_ensemble: 2                      # ForwardMap num_parallel

# optimisation
lr_f: 1e-4
lr_b: 1e-4
lr_actor: 1e-4
discount: 0.99

# FB
ortho_coef: 1.0
pessimism: 1.0
train_goal_ratio: 0.5
actor_std: 0.1
f_target_tau: 0.005
b_target_tau: 0.005

# FlowBC (ignored when agent=fb)
bc_coeff: 0.0
flow_steps: 10                     # n_action_samples at eval for FlowBC

# eval
eval_n_episodes: 10
eval_relabel_size: 512

# logging
use_wandb: false
wandb_project: factored-fb
wandb_run_name: null
save_dir: checkpoints/