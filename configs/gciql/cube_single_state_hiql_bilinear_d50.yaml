# HIQL with the bilinear value head at FB-parity rank d=50 (option A: keeps HIQL's
# state-dependent subgoal rep, V(s,g)=<phi(s),psi(goal_rep([s;g]))>/sqrt(d)). One shared
# value -> the bilinear form applies to both hierarchy levels at once. AWR actors => GPU eval.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: agents/hiql.py
seed: 0
train_steps: 1000000
log_interval: 5000
eval_interval: 100000
save_interval: 1000000
eval_episodes: 50
eval_on_cpu: 0
run_group: HIQL-State-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
wandb_mode: online
