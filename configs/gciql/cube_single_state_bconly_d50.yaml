# Spec 19 section 1 P0.2 -- BC-only control (PAPER/Multistep-FB/specs/19-ors-program.md).
# An open debt in the program: no cube-single number is currently attributable to the
# measure_density objective rather than the bc_coeff=3.0 cloning term the flow actor
# ALSO trains on. This cell is byte-equal to the density arm's slot settings
# (configs/gciql/cube_single_state_measure_density_d50.yaml) with ONE addition:
# actor_bc_only: true, which zeroes the flow actor's q-term (reuses the existing
# "pure BC flow" code path spec 19a's measure_density_behavior already established --
# see tools/wandb_mode_shim/gciql_flow.py actor_loss). The density critic/towers still
# train normally on density_loss; only the ACTOR ignores the resulting q, so a gap
# between this run and the density arm's success rate is attributable to the measure
# reaching the actor, not to the recipe otherwise differing.
#
# Gate: cs success here vs the density arm (cube_single_state_measure_density_d50.yaml,
# anchor ~0.93 avg / fp-noortho 0.967) -- a LARGE gap (BC-only far below) says the
# density measure IS doing work through the actor's q-term; a SMALL gap says bc_coeff
# alone is carrying cube-single and the density number is not yet attributable to the
# measure (spec 19 section 1 P0.2 pre-registration).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-CubeSingle-Flow-BCOnly-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_density: true
  measure_density_dim: 50
  measure_density_temp: 1.0
  measure_hit_spec: "19:22:0.4"
  actor_q_center: true
  actor_bc_only: true
wandb_mode: online
