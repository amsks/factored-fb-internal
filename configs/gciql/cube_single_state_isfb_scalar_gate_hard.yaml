# ISFB (PAPER/fb-modified/isfb.tex) on cube: exact-goal in-sample Forward-Backward,
# measure_insample=scalar_gate_hard. Scalar-gated expectile improvement on the FB successor
# measure (no a+~pi bootstrap). Targets the C4->B4 gap (16 -> ~87). 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/isfb_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: ISFB-State-ScalarGateHard-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  measure_insample: scalar_gate_hard

wandb_mode: online
