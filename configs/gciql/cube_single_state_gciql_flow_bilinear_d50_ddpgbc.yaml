# No-flow-actor control: bilinear d=50 critic with the stock GCIQL gaussian DDPG+BC
# actor (actor_kind=ddpgbc) instead of the flow actor. Tests the actor-exoneration
# claim directly at the bilinear value.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-ddpgbc
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  actor_kind: ddpgbc
  actor_loss: ddpgbc
wandb_mode: online
