# bc_coeff fix (td_jepa HP audit 2026-07-07): antmaze GCIQL flow-bilinear ran the
# cube-tuned bc_coeff=3.0; td_jepa's FB antmaze sweep uses 0.3 (10x weaker BC),
# mirroring OGBench's alpha pattern (antmaze 0.3 vs cube/scene 1.0). Rerun the
# collapsed cell (23.9 @ bc3.0) at the domain-correct 0.3.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: antmaze-medium-navigate-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIQL-AntMaze-Medium-Flow-Bilinear-d50-bc03
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  alpha: 0.3
  bc_coeff: 0.3
wandb_mode: online
