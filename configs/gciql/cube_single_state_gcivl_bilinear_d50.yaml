# GCIVL (flat goal-conditioned IVL) with the bilinear value head at FB-parity rank d=50.
# Flat: no subgoal rep, so V(s,g)=<phi(s),psi(g)>/sqrt(d) directly (clean GCBilinearValue
# swap, same head as GCIQL/FB). Gaussian AWR actor => GPU eval.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: agents/gcivl.py
seed: 0
train_steps: 1000000
log_interval: 5000
eval_interval: 100000
save_interval: 1000000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIVL-State-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
wandb_mode: online
