# E3 corrected SF cell (audit-20260706 §6): sf_feature_td + LEARNED base trained by reward
# regression at d=50. Q(s,a,g)=<phi(s,a), psi(g)>/sqrt(d); psi trained ONLY by the bilinear
# reward model r_hat(s',g)=<psi(s'),psi(g)>/sqrt(d) regressed on batch rewards (the reference's
# reward-prediction basis, sf_simple.py) -- fixes the identity/frozen cells' semantic confound
# (goal indicator not linearly expressible in an unlearned base). phi still trained ONLY by the
# per-sample SF vector TD:
#     phi(s,a) <- sg[psi(s)] + gamma * mask * phi_target(s',a'),   a' ~ pi(s',g)
# Discriminator: vector-TD-per-se vs what-signal-weights-the-fit (measure = rho-weighted density;
# this = task-weighted reward). Anchors: frozen/identity band 0.09-0.16 (confounded), scalar-TD
# bilinear GCIQL 0.90, zg_iql 0.44. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SF-FeatureTD-RewReg
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  sf_feature_td: true
  sf_base: learned
  sf_reward_regress: true
  sf_reward_coef: 1.0
  sf_coef: 1.0
wandb_mode: online
