# Ledger §9.16 arm 2 -- phase 2 with a DENSITY-MATCHED training region. §9.16: the phase-2
# collapse tracks the off-diagonal grounding rate at the training eps (cube-single 1.30%
# vs cube-double 0.046% / scene 0.29% -- 28x/4.5x sparser), and the visitation Q collapses
# to the hindsight dwell constant. This arm widens ONLY the phase-2 training eps so the
# grounding rate matches cube-single's (~1.3%, measured on the datasets 2026-07-30:
# cube-double eps 0.96 -> 1.21%, scene x1.9 -> 1.29%). Phase 1 warm start and the native
# eval are UNCHANGED (eval still scores the env's own success predicate).
# Pre-registered read: q_abs_mean comes DOWN off the dwell constant, signed variation
# (1 - q_mean/q_abs) returns toward cube-single's 11-18%, and the 0-100k success decay
# shrinks vs p2_cd/p2_sc. If success still decays with grounding matched, sparsity is NOT
# the mechanism and the arm has falsified §9.16's HP claim.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: scene-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Scene-Flow-Measure-BallVisit-EpsDM-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.76,28:30:0.95,32:34:0.95,36:37:1.37,38:39:1.14"
  measure_fp_absorbing: false
  measure_stopgrad_psi: true
  actor_q_center: true
wandb_mode: online
