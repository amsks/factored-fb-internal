# bc_coeff fix control: antmaze GCIQL flow with the STOCK MLP value @ bc_coeff=0.3
# (paired control for the bilinear bc03 cell; the old flow-MLP 33.3 ran bc=3.0).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: antmaze-medium-navigate-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIQL-AntMaze-Medium-Flow-MLP-bc03
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: mlp
  alpha: 0.3
  bc_coeff: 0.3
wandb_mode: online
