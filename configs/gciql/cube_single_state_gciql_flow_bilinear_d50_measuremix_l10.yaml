# E2 dose-response EXTENSION (follows the psi cross-eval finding, 2026-07-07): the measure
# objective conflicts with the scalar-TD psi geometry, visible only under stopgrad-phi
# (cos .893->.815, aucE .921->.810 at lambda=1). Extend lambda past 1 to trace the full
# degradation curve (sgphi arm) and find where SHARED legs stop absorbing it (l10 shared arm).
# Same scale_norm guardrail as E2: q_mean in [-100,10].
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-MeasureMix-l10
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: false
  measure_coef: 10.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_stopgrad_phi: false
wandb_mode: online
