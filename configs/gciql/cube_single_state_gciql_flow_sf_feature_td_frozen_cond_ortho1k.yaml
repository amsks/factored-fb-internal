# sf_feature_td + orthonormality AUX REG (coef 1000) on the SF vector phi (anti-collapse,
# ||E[phi phi^T]-I||). TASK-CONDITIONED. base=frozen (d=50), fb_forward_z=true. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SF-FeatureTD-FrozenCond-Ortho1k
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  sf_feature_td: true
  sf_base: frozen
  fb_forward_z: true
  sf_ortho_coef: 1000.0
  sf_coef: 1.0
wandb_mode: online
