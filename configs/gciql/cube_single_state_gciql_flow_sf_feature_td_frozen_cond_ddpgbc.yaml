# sf_feature_td + TASK-CONDITIONED phi (fb_forward_z): the FAITHFUL canonical-SF cell.
# Reference (raymondchua canonical) feeds the task into the SF net (cat([obs, task])); this
# conditions phi on z=psi(g): base=frozen (d=50). Trains ONLY phi via the SF vector TD
# phi([s,a,z]) <- b(s) + gamma*phi_target([s',a',z]). Sibling of the task-AGNOSTIC baseline
# (which reproduced the SF collapse ~0.09). 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SF-FeatureTD-FrozenCond-DDPGBC
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  sf_feature_td: true
  sf_base: frozen
  fb_forward_z: true
  sf_coef: 1.0
  actor_kind: ddpgbc
wandb_mode: online
