# C5b — FB-fidelity rescue, arm 2 (z-coverage + z-consistent bootstrap): C5a + actor_cond=z
# sourced from the critic psi (the D1 knob), so the measure TD's bootstrap action is
# a+ ~ pi(s+, z_i) at the SAME mixed z the TD is evaluated at (FB: the measure of the
# z-greedy policy), not pi(s+, psi(vgoals)). KNOWN residual infidelity: the actor's own
# loss still trains only at z=psi(actor_goals) (FB trains the actor across the mixed-z
# distribution too) — actor-side z-mix is a follow-up knob if this arm moves the needle.
# Read against C5a (isolates the bootstrap-consistency term) and D1 (actor-z, no zmix). 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-C5-Zmix-ActorZ
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  fb_forward_z: true
  project_z: true
  measure_ortho_coef: 1.0
  measure_z_random_frac: 0.5
  actor_cond: z
  actor_z_from_critic: true
wandb_mode: online
