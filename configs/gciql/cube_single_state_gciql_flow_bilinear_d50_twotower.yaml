# #4 ablation: FB-style two-tower forward map F=trunk(MLP[s,a], MLP[s,z]) on the
# IQL bilinear-GCIQL d50 (the ~90 performer), z=sg(psi(g)). Architecture-only --
# NO measure loss, pure IQL. Tests whether porting FB's forward-map shape costs the
# IQL bilinear anything before trying it on FB. 3 seeds @500k, vs d50 baseline (90.4).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-TwoTower
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  fwd_two_tower: true
wandb_mode: online
