# Spec 08 E7 (second environment) -- PHASE 1 of the two-phase curriculum on cube-double.
# Port of the cube-single winner (cube_single_state_measure_firstpassage_noortho_d50, 0.967)
# with ONE change: the goal region. cube-double's obs is 37-dim with a second cube block, and
# the env's own success criterion is the CONJUNCTION over cubes (ogbench cube_env.py:728,
# `self._success = all(cube_successes)`), so the hit indicator becomes
#   h = 1[||c0(s')-c0(g)|| <= 0.4] AND 1[||c1(s')-c1(g)|| <= 0.4]     (0.4 obs units = 4cm)
#
# PRE-FLIGHT (measured on the real dataset, B=1024 as in training): this conjunction fires on
# 0.15% of batch pairs = 0.51 off-diagonal positives per row, vs cube-single's 14.0. That is a
# ~27x sparser reward, so a floor here is CONFOUNDED with sparsity -- read this cell against
# cube_double_state_measure_fp_noortho_1cube_d50.yaml (same cell, region on cube 0 only,
# 18.6 positives/row) which isolates the conjunction from the method.
#
# Anchor: no GC-IQL bilinear-d50 number exists for cube-double; run_group
# GCIQL-CubeDouble-Flow-Bilinear-d50 supplies it. 2 seeds, 500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-double-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-CubeDouble-Flow-Measure-FirstPassage-NoOrtho-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4,28:31:0.4"
wandb_mode: online
