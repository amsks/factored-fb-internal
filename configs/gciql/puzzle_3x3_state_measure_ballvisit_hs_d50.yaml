# Ledger §9.16c scale-out -- the HINDSIGHT test-point arm on puzzle-3x3.
#
# Arm 3 of p2fix (measure_testpoint_dist=hindsight) was the only arm that beat its control on
# both regression envs (cube-double 0.500/0.544 vs control 0.368/0.348; scene 0.916/0.904 vs
# 0.332/0.352, i.e. ~2x phase 1's 0.484). Before that enters the paper it needs (a) a third
# env and (b) the seed-2 replicate. Puzzle-3x3 is the hardest available case: §9.16 records it
# as FLAT at the degenerate 0.200 under the canonical phase-2 recipe (nothing to lose), and
# its off-diagonal grounding rate is 0.20% -- 6.5x sparser than cube-single's 1.30%.
#
# Identical to puzzle_3x3_state_measure_ballvisit_d50 except measure_testpoint_dist. Columns
# become psi(value_goals) (0.5 traj-future / 0.3 random / 0.2 current) instead of
# psi(next_observations); NO importance correction, so the object is no longer the
# rho-referenced measure (intentional, documented at the knob).
#
# Pre-registered read (write into §9.16c):
#   PRIMARY   -- final success ABOVE the degenerate 0.200 floor by more than eval noise
#                (>=0.25 on both seeds). Puzzle is the cleanest test of whether hindsight adds
#                structure rather than merely protecting structure phase 1 already had:
#                on cd/sc hindsight recovered a level phase 1 reached, here there is none.
#   SECONDARY -- q_abs_mean and negative-mass fraction, recorded either way. On cd/sc the
#                hindsight arm moved these the WRONG way vs the §9.16b prediction (q_abs UP
#                past the dwell constant, neg-frac collapsing to ~0.004). If puzzle repeats
#                that signature, it is a property of the knob, not of those two envs.
#   NULL      -- flat at 0.200 like the control => hindsight rescues only envs where phase 1
#                already worked, and the §9.16c claim must be scoped to those.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: puzzle-3x3-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Puzzle3x3-Flow-Measure-BallVisit-Hindsight-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:21:0.5,23:25:0.5,27:29:0.5,31:33:0.5,35:37:0.5,39:41:0.5,43:45:0.5,47:49:0.5,51:53:0.5"
  measure_fp_absorbing: false
  measure_stopgrad_psi: true
  actor_q_center: true
  measure_testpoint_dist: hindsight
wandb_mode: online
