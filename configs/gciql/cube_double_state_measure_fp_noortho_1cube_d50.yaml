# Spec 08 E7 -- the SPARSITY CONTROL for cube-double phase 1.
# Identical to cube_double_state_measure_firstpassage_noortho_d50.yaml except the goal region
# is defined on cube 0 only ('19:22:0.4'), exactly as on cube-single. Measured density at
# B=1024: 18.6 off-diagonal positives/row (cube-single = 14.0), vs 0.51 for the 2-cube
# conjunction -- so this cell has cube-single-like supervision on a harder env.
#
# Single-axis read:
#   both cells reach the anchor          -> reach-first transfers; conjunction sparsity is fine
#   1cube reaches, conjunction floors    -> the failure is REWARD SPARSITY, not the method
#                                           (fix = larger batch / hindsight columns, not a new objective)
#   both floor                           -> reach-first does not transfer to 2-object manipulation;
#                                           this is the informative negative the spec asks for
# NOTE this cell's region ignores cube 1, so its policy is NOT expected to solve the native
# 5-task eval (4 of 5 tasks move both cubes). It is a TRAINING-SIGNAL diagnostic; read its
# critic/scale traces and its task-1 (single_pnp) success, not the overall mean.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-double-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-CubeDouble-Flow-Measure-FP-NoOrtho-1Cube-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4"
wandb_mode: online
