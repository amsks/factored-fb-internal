# Coverage cell: GCIVL flow-bilinear on antmaze (never run; cube = 79.2, the largest
# GCIVL win). AWR-flow-BC actor has no bc_coeff; BC-strength knob = alpha, and the
# OGBench antmaze-tuned GCIVL alpha (10.0) equals the agent default, so no override.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: antmaze-medium-navigate-v0
agent_file: tools/wandb_mode_shim/gcivl_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIVL-AntMaze-Medium-Flow-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
wandb_mode: online
