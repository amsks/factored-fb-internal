# HIQL debug (correct OGBench HP): native AWR HIQL, bilinear-d50 value, subgoal_steps=10.
# Decisive cell: does the bilinear value head hurt HIQL once the subgoal horizon is
# tuned (sg=10)? Compare against cube_single_state_hiql_native_mlp_sg10 (both @500k,
# 3 seeds). Prior HIQL-State-Bilinear-d50 (15.9) was confounded by sg=25.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: agents/hiql.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: HIQL-State-Native-Bilinear-d50-sg10
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  subgoal_steps: 10
wandb_mode: online
