# Spec 25 stage 1 -- z25_cs_tilt: C1 structural logit tilt ONLY, on top of spec 24's
# z-indexed density measure (PAPER/Multistep-FB/specs/25-z-coupling-port.md section 0/3).
#
# C1 makes the tilted score l_ij = F(s,a,z)^T B(u)/tau + beta * z^T B(u)/sqrt(d) so w(s,a,z)
# is z-sensitive by construction from step 0 -- the "ignore z" fixed point spec 24's audit
# found (score spread .00086 max) stops being reachable. beta is FIXED, not learned; round-1
# dose beta=1.0, one value, no sweep (anti-scope section 6).
#
# Everything else is byte-identical to cube_double_state_measure_density_z_d50.yaml's
# z-lattice, ported to the cube-single venue: env_name and measure_hit_spec match
# cube_single_state_measure_density_d50.yaml (the g-indexed cube-single anchor, .929 soft),
# not cube-double's two-object hit_spec.
#
# Screen gate S1 (spec 25 section 3): density_w_ztv bounded away from 0 at 500k AND
# E1 (goal-encoding z(g) conditioning) >= 0.5 (g-anchor ~= .93; spec-24 z scored ~0 on cd).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-CubeSingle-Flow-Measure-DensityZ-C1Tilt-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_density: true
  measure_density_dim: 50
  measure_density_temp: 1.0
  measure_density_z: true
  measure_density_z_rand_frac: 0.5
  measure_hit_spec: "19:22:0.4"
  actor_q_center: true
  measure_density_z_tilt: 1.0
wandb_mode: online
