# sf_feature_td + FROZEN random base at d=50 (matches FB / bilinear-GCIQL rank).
# Q(s,a,g)=<phi(s,a), psi(g)>/sqrt(d), psi = a random-init MLP HELD FROZEN (never trained);
# base feature b(s)=psi(s). Train ONLY phi with the per-sample SF vector TD:
#     phi(s,a) <- psi(s) + gamma * mask * phi_target(s',a'),   a' ~ pi(s',g)
# Freezing psi is the SF anti-collapse fix (random encoder) and frees d from obs dim -> d=50.
# Sibling of the identity-b (d=28) run. Anchor: FB zg_iql 0.44. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SF-FeatureTD-Frozen50-DDPGBC
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  sf_feature_td: true
  sf_base: frozen
  sf_coef: 1.0
  actor_kind: ddpgbc
wandb_mode: online
