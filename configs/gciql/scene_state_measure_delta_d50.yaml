# Spec 17a -- variant A, `measure_delta`, on scene (analogous to
# cube_double_state_measure_delta_d50.yaml): the region successor-measure TD target
# becomes the signed event indicator hit(x')-hit(x) instead of the raw arrival
# indicator hit(x') (PAPER/rescuing-fb/specs/17a-delta-measure-impl.md). Same phase-2
# warm-start recipe as scene_state_measure_ballvisit_d50.yaml (frozen psi, centered
# actor normalizer, batch test-point columns) and scene's unchanged 5-way goal region
# -- ONLY the target reward moves. PRIMARY vs the §9.16 batch-column collapse (spec 17
# §6, d17_sc_delta_b).
#
# eval_interval=10000: instruments the 0->10k shock window (§9.16 dense-wave finding).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: scene-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 10000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Scene-Flow-Measure-Delta-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4,28:30:0.5,32:34:0.5,36:37:0.72,38:39:0.6"
  measure_fp_absorbing: false
  measure_stopgrad_psi: true
  actor_q_center: true
  measure_delta: true
wandb_mode: online
