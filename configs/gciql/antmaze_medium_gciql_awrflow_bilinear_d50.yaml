# Readout-matrix cell {AWR-flow x GCIQL} on antmaze: decides whether the antmaze
# flow collapse (23.9 @bc3.0, unrescued by bc0.3) is the Q-max distillation readout
# or the GCIQL critic itself. AWR-flow works on antmaze for V-only critics
# (GCIVL-flow 0.84, HIQL-v3-flow 0.94); recovery here pins it on the readout.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: antmaze-medium-navigate-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIQL-AntMaze-Medium-AWRFlow-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  actor_kind: awr_flow
wandb_mode: online
