# exp4: the G4 "next control" -- train the flow actor across the INFERRED task
# distribution z=E[r*psi] (sparse-reward readout over the batch), not only the exact
# goal embedding z=psi(g). G4's inferred-z collapse (7 despite cf-AUC 0.92) was confounded
# because the actor only ever saw exact z=psi(g); this trains + evals on inferred z, to
# separate "FB inference is fragile" from "this actor never saw inferred z". IQL bilinear
# d50 + z-cond flow actor. Compare vs G4 exact-z 93 / inferred-z 7. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-Exp4-ActorZInfer
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  actor_cond: z
  actor_z_infer: true
  measure_only: false
  measure_coef: 0.0
wandb_mode: online
