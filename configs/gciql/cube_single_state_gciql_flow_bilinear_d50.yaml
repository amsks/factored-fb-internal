# Bilinear bridge at FB-parity rank d=50 (the headline bridge cell). GCIQL IQL
# value in FB's inner-product form Q=phi(s,a).psi(g)/sqrt(d), flow actor, exact
# goal. Was originally launched via base gciql_flow + agent_overrides; pinned to a
# file here so the 10-seed x 1M campaign can reference one --config-name.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 1000000
log_interval: 5000
eval_interval: 100000
save_interval: 1000000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
wandb_mode: online
