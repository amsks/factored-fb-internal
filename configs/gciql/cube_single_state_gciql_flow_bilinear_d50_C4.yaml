# Cluster-C endpoint (C4): rebuild real FB INSIDE the GCIQL code, from the measure side.
# measure_only successor-measure objective + z-conditioned forward map (fb_forward_z) +
# sphere-Norm(z,B)=sqrt(d) + FB orthonormality at FB's TRUE coef 1.0 (C1=fb_forward_z@ortho1000
# was 25.5; this lowers ortho 1000->1.0 and adds the sqrt(d) Norm). Targets plain-FB=48: if
# C4 reaches ~48, the 9%->48 deficit was missing FB restrictions in the graft, and the 48->90
# residual is purely objective. (Forward map is flat fb_forward_z, not FB's two-tower -- the
# two-tower-under-measure rung is scheduled separately.) 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-C4-FBrebuild
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  fb_forward_z: true
  project_z: true
  measure_ortho_coef: 1.0
wandb_mode: online
