# Ledger §9.16 arm 3 -- phase 2 with HINDSIGHT test-point columns (spec06 item7 knob):
# columns = psi(value_goals) (0.5 traj-future / 0.3 random / 0.2 current) instead of
# psi(next_observations). Rationale (§9.16): grounded hit events at nontrivial distances
# (a state within eps of its OWN future = a real approach event) appear at a per-batch rate
# that is independent of the region's off-diagonal sparsity -- the sparsity-independent
# grounding fix, complementary to the eps arm. NO importance correction: the object is no
# longer the rho-referenced measure (intentional, documented at the knob).
# Pre-registered read: same as the eps arm -- q_abs off the dwell constant, decay shrinks.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: scene-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Scene-Flow-Measure-BallVisit-Hindsight-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4,28:30:0.5,32:34:0.5,36:37:0.72,38:39:0.6"
  measure_fp_absorbing: false
  measure_stopgrad_psi: true
  actor_q_center: true
  measure_testpoint_dist: hindsight
wandb_mode: online
