# Expectile (improvement-operator) ablation on the bilinear bridge at FB-parity rank
# d=50: tau=0.95. tau=0.5 => V is the in-data MEAN (pure policy-evaluation, no
# improvement operator -- the FB-measure regime); tau=0.95 => aggressive in-support
# max. Tests whether the in-support max is what FB lacks. Flow actor, exact goal.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-tau095
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  expectile: 0.95
wandb_mode: online
