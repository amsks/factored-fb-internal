# Ledger §9.16c -- d128 PHASE 1 on scene (stage 1 of the rank campaign).
#
# Companion to cube_double_state_measure_firstpassage_noortho_d128; see that file for the full
# rationale (arm-2 NULL falsified the sparsity story; rank is the named next suspect).
# scene's hit spec is a conjunction over FIVE coordinate blocks -- the widest conjunction in
# the suite -- so if rank is the binding constraint anywhere it should bind hardest here.
#
# Identical to scene_state_measure_firstpassage_noortho_d50 except value_latent_dim.
#
# Pre-registered read: phase 1 at d128 matches the d50 phase-1 anchor (sc 0.484) within eval
# noise; the stage-2 d128 phase-2 cell is scored against whichever number this cell produces.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: scene-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Scene-Flow-Measure-FirstPassage-NoOrtho-d128
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 128
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4,28:30:0.5,32:34:0.5,36:37:0.72,38:39:0.6"
wandb_mode: online
