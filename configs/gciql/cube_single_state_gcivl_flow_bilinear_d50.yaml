# GCIVL (flat IVL value) with the bilinear value head at d=50 AND a FlowBC actor
# (advantage-weighted flow-matching BC, the V-only analog of FQL). Tests whether the
# flow actor improves GCIVL-bilinear over its native Gaussian-AWR actor (~67.5 @500k).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gcivl_flow.py
seed: 0
train_steps: 1000000
log_interval: 5000
eval_interval: 100000
save_interval: 1000000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIVL-State-Flow-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
wandb_mode: online
