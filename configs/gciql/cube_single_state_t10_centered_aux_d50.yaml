# T10-a -- centered (advantage) successor measure, AUX arm (coexistence read).
# Spec: PAPER/rescuing-fb/04-centered-measure-spec.md §2 (pre-registered 2026-07-16).
#
# Stock bilinear-d50 scalar-IQL grounding (the 0.904 anchor recipe) + NEW:
#   b(s)  regressed (scale-normed) to sg[mean_{a~mu} phi(s,a)], K=8 samples from
#         the goal-agnostic BC flow (the frozen behavior policy mu);
#   DeltaM = (phi(s,a) - sg[b(s)]).psi(s')/sqrt(d) trained by the centered
#         measure TD (offdiag + diag attraction, own scale-norm, a'~pi), lam_DeltaM=1.
# The actor consumes the FULL critic Q = phi.psi = U + DeltaM, q-normalized by
# sg|Q_full| (spec §4 risk 1: never DeltaM alone -- the dueling Arch-11 floor).
#
# Read: does a measure-trained advantage coexist with the scalar-TD advantage?
# Success >= 0.85 (anchor: plain bilinear IQL 0.904; E2 raw-measure aux 0.86-0.92).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-CenteredMeasure-Aux-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  centered_measure: aux
  centered_measure_coef: 1.0
  center_b_samples: 8
wandb_mode: online
