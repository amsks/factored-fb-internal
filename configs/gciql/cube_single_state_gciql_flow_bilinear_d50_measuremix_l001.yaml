# E2 scale-controlled IQL + lambda*measure interpolation (audit-20260706 §1; zeroshot spec §E2).
# FB successor-measure GRAFTED onto the working ~0.90 IQL bilinear-d50 flow cell (measure_only=false,
# on top of the full IQL loss), with measure_scale_norm ON so the gradient is dimensionless and no
# longer crashes via <F,z> inflation (the confound that killed 18/18 raw mc* runs).
# I-lambda.01: shared-legs, smallest dose. 3 seeds @500k. Guardrail: q_mean in [-100,10], grad_norm <=500.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-MeasureMix-l001
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: false
  measure_coef: 0.01
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_stopgrad_phi: false
wandb_mode: online
