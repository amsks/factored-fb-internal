# Readout-vs-TD crux, arm 1 (sf-design-space.md 1b). The 0.90 bilinear-d50 flow cell,
# UNCHANGED except that the goal leg psi(g) is a FROZEN random MLP (never trained) on both
# the value net and the critic. Same scalar IQL expectile TD, same flow actor, same d=50.
#
# This is the SF cells' frozen-psi handicap WITHOUT their vector TD. Reads against:
#   GCIQL-State-Flow-Bilinear-d50 (learned psi, scalar TD) = 0.90   <- the control
#   SF + frozen psi (frozen psi, VECTOR TD)                = 0.013-0.157
# If this stays ~0.9 the SF collapse is pinned on the vector TD itself; if it collapses,
# the frozen readout was part of SF's handicap and the SF cells never isolated the TD.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-FrozenPsi
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  psi_base: frozen
wandb_mode: online
