# C2: the measure objective on FB's TWO-TOWER forward map (the measure side never got
# two-tower -- Direction A gave it only to the IQL critic, 86.4). measure_only + fwd_two_tower
# routes to GCTwoTowerCritic; the successor-measure loss runs on its forward legs. FB's true
# ortho coef 1.0. Discriminates: does FB's two-tower architecture help the measure objective
# (vs MeasureOnly bilinear = 9.9)? Bookends B1. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-C2-MeasureTwoTower
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  fwd_two_tower: true
  measure_ortho_coef: 1.0
wandb_mode: online
