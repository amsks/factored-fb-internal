# C ablation: fb_forward_z + project_z + ortho1000 (C1=25.5 PLUS sphere-Norm; isolates project_z).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-C-FBzProjZ-O1000
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  fb_forward_z: true
  project_z: true
  measure_ortho_coef: 1000.0
wandb_mode: online
