# Rank control for the identity-psi arm (sf-design-space.md 1b). Stock bilinear GCIQL flow
# cell with a LEARNED psi at d=28 -- the rank the identity map pins (== cube-single obs dim).
# Without this, `GCIQL-State-Flow-Bilinear-IdentityPsi` (d=28, psi=g) confounds "psi is the raw
# obs" with "the rank dropped 50 -> 28". Reads against d50 (0.90) and the identity arm.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d28
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 28
wandb_mode: online
