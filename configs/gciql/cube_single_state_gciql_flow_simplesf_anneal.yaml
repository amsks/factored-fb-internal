# SimpleSF CURRICULUM (sf-design-space, the anneal analogue of the SM warm-start): cold-start the
# Simple SF architecture and cross-fade the objective WITHIN the run -- from rung 2 (true-reward
# scalar TD, which reaches ~0.38) toward rung 3 (reward-regression grounding, which fails at the
# ~0.166 prior). anneal_iql_fade fades the true-reward value+critic TD OUT (weight 1->0) while
# anneal_simplesf_ground fades the grounding L_rew = <sg[b], psi(g)>/sqrt(d) IN (0->reward_coef),
# both over anneal_ramp. psi keeps the rung-2 architecture (simplesf_ground_psi=FALSE, z NOT
# stop-gradded): the fade -- not a detach -- hands psi's training from the TD to the reward
# regression. Endpoint = reward-regressed psi on the (TD-faded, hence frozen) rung-2 trunk -- the
# frozen-representation readout probe, reached by annealing.
#
# The question: is rung 3's failure an OPTIMIZATION-PATH artifact (does grounding survive once
# reached from rung 2's good geometry?) or a REPRESENTABILITY wall (r not linearizable in b, so
# simplesf/reward_loss stays pinned at the ~0.166 prior no matter the path)? Read reward_loss
# alongside success: a plateau at the prior with collapsed success => representability, not path.
#
# NO warm-start checkpoint: rung 2 and rung 3 share GCSimpleSFValue's param tree, so the curriculum
# is a single cold run. anneal_ramp=300k over 500k leaves a 200k hold at the grounded endpoint.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SimpleSF-Anneal
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: simplesf
  value_latent_dim: 50
  project_z: true
  simplesf_ground_psi: false
  simplesf_reward_coef: 1.0
  anneal_iql_fade: true
  anneal_simplesf_ground: true
  anneal_ramp: 300000
wandb_mode: online
