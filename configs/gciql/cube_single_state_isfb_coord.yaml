# ISFB (PAPER/fb-modified/isfb.tex) on cube: exact-goal in-sample Forward-Backward,
# measure_insample=coord. Scalar-gated expectile improvement on the FB successor
# measure (no a+~pi bootstrap). Targets the C4->B4 gap (16 -> ~87). 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/isfb_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: ISFB-State-Coord-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  measure_insample: coord
  isfb_alpha_v: 0.0   # clean coordinatewise baseline: no scalar gate (its advantage is unused)

wandb_mode: online
