# Missing SOTA-Bilinear cell: scene-play GCIQL bilinear-d50 with the stock GCIQL
# gaussian DDPG+BC actor (not the flow actor). This is the scene analogue of the
# antmaze ddpgbc-bilinear win (83.7) and the most likely scene-SOTA contender.
# Scene GCIQL uses alpha=1.0 (OGBench impls/hyperparameters.sh).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: scene-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-Scene-Bilinear-d50-DDPGBC
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  actor_kind: ddpgbc
  actor_loss: ddpgbc
  alpha: 1.0
wandb_mode: online
