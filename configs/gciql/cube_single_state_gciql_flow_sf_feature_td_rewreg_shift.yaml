# E3 v2: rewreg cell with sf_reward_shift=1.0 -- regress the bilinear reward model on
# r+1 in {0,1} instead of raw {-1,0}. v1 (RewReg group) collapsed to the psi=0 saddle:
# the symmetric bilinear form's gradient vanishes at psi=0, where the {-1,0} majority
# class (-1) had driven it (sf_rhat_mean~0, sf_reward_loss~0.79=E[r^2], success~0).
# With {0,1} targets the majority class IS the saddle and goal pairs demand
# <psi(s'),psi(g)>=1 -> peaked kernel; Q ~ sum gamma^t 1[s_t=g] (success density),
# argmax-invariant to the constant shift. Everything else identical to v1. 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-SF-FeatureTD-RewReg-Shift
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  sf_feature_td: true
  sf_base: learned
  sf_reward_regress: true
  sf_reward_coef: 1.0
  sf_reward_shift: 1.0
  sf_coef: 1.0
wandb_mode: online
