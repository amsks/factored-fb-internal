# Readout-matrix cell {AWR-flow x GCIQL}: bilinear-d50 IQL critic read out by
# AWR-weighted goal-conditioned flow-BC (exp(awr_alpha*(minQ-V)), awr_alpha=10 =
# OGBench GCIVL AWR temp) instead of FQL Q-max distillation. Cube reference:
# Q-max flow 90.4 / ddpgbc 51.3(alpha-confounded) / stock 70.3. Tests whether
# cube's win NEEDS Q-max greediness.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 0
run_group: GCIQL-State-AWRFlow-Bilinear-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  value_arch: bilinear
  value_latent_dim: 50
  actor_kind: awr_flow
wandb_mode: online
