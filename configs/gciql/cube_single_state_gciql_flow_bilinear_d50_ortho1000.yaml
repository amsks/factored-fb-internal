# "Bilinear GCIQL + orthonormality ONLY (nothing else from FB)": the ~90 IQL
# bilinear d50 (flow actor, exact goal, pure IQL value/critic) + the FB
# orthonormality penalty ||E[psi psi^T]-I|| on psi, at FB's cube coef 1000. NO
# measure loss, no z-conditioning, no two-tower. Isolates whether the ortho
# constraint alone helps/hurts the IQL bilinear. 3 seeds @500k, vs d50 (90.4).
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-Ortho1000
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  iql_ortho_coef: 1000.0
wandb_mode: online
