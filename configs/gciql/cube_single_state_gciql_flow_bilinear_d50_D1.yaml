# Cluster-D (D1): actor z sourced from the CRITIC psi (=B, measure-trained), not the value
# net (audit #2). Exact FBz-O1000 measure cell (=25.5) + actor_cond='z' + actor_z_from_critic.
# Under measure_only the value net is untrained, so the stock actor_cond='z' would feed the
# actor garbage; D1 conditions actor and critic on the SAME z (real FB). Single-variable vs
# the 25.5 FBz baseline (only the actor's z-source changes). 3 seeds @500k.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-single-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 100000
save_interval: 500000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-State-Flow-Bilinear-d50-D1-ActorZCritic
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  fb_forward_z: true
  measure_ortho_coef: 1000.0
  actor_cond: z
  actor_z_from_critic: true
wandb_mode: online
