# Ledger §9.16 arm 1 -- phase 2 with the ACTOR FROZEN at the warm-started phase-1 policy
# (E2 recipe, cube-single 0.972). §9.16 showed the multi-env phase-2 regression is early
# actor drift under a collapsed visitation Q (q_abs == hindsight dwell mass 43.5/32.1);
# masking the actor optimizer erases the regression BY CONSTRUCTION while phi still trains
# to visitation semantics. Native success is expected == phase 1 exactly; the readout of
# interest is train.csv q_abs_mean (does the measure still collapse? -> yes predicted) and
# the later measure-axis evals.
defaults:
  - storage: shm
  - _self_
variant: state
env_name: cube-double-play-v0
agent_file: tools/wandb_mode_shim/gciql_flow.py
seed: 0
train_steps: 500000
log_interval: 5000
eval_interval: 50000
save_interval: 100000
eval_episodes: 50
eval_on_cpu: 1
run_group: GCIQL-CubeDouble-Flow-Measure-BallVisit-FrzActor-d50
restore_path: null
restore_epoch: null
exp_name: null
agent_overrides:
  bc_coeff: 3.0
  value_arch: bilinear
  value_latent_dim: 50
  measure_only: true
  measure_coef: 1.0
  measure_legs: critic
  measure_ortho_coef: 0.0
  measure_scale_norm: true
  measure_first_passage: true
  measure_hit_spec: "19:22:0.4,28:31:0.4"
  measure_fp_absorbing: false
  measure_stopgrad_psi: true
  actor_q_center: true
  freeze_actor: true
wandb_mode: online
