# VIP critic — state-based Value-Implicit Pre-training (arXiv:2210.00030).
# V(s;g) = -||phi(s)-phi(g)||_2, trained with the Fenchel-dual objective on VIPDataset
# sub-trajectory batches. Representation-only: pair with the bcflow actor.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
latent_dim: 50            # embedding width; sweep {50, 512} to mirror iql_bilinear
discount: 0.98            # VIP's gamma (their code default); 0.99 for the sensitivity run
dataset_class: VIPDataset
