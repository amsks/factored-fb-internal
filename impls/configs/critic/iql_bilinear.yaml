# IqlBilinear critic — GCIQL's expectile-V + twin-Q TD on a low-rank bilinear head
# Q(s,a,g) = <phi(s,a), psi(g)>/sqrt(d). Objective values mirror critic/gciql.yaml; the
# head/knob values mirror the bridge sweeps in tools/wandb_mode_shim/gciql_flow.py.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.9

# --- bilinear head ---
value_latent_dim: 512     # d; the rank of the goal bottleneck (the d-sweep axis)
psi_layer_norm: true      # false: de-LayerNorm the goal tower ONLY (phi keeps layer_norm) —
                          # the norm-concentration ablation (phenomenon.tex Pred. mech.2).
                          # true matches vendored (psi LN == layer_norm).
psi_base: learned         # learned | frozen | identity  (identity PINS d == goal dim)
project_z: false          # hard sphere-Norm psi onto radius sqrt(d); reaches BOTH nets
double_q: true            # false ablates the clipped double-Q to the single head q1
iql_ortho_coef: 0.0       # FB orthonormality on the critic's goal leg (no measure). >0
                          # requires psi_base='learned' (it is inert on frozen/identity).

# --- actor conditioning ---
actor_cond: goal          # goal | z  (z => the actor conditions on psi(goal), width d)
actor_z_from_critic: false  # D1: read the CRITIC's psi instead of the value net's.
                            # Requires actor_cond='z' (silent no-op otherwise, audit S6).
actor_z_infer: false        # condition on the INFERRED z = E[r psi(s')] instead of psi(g)

# dataset (GCDataset goal sampling) — identical to critic/gciql.yaml
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
