# RLDP at OFFICIAL parity — the ExoRL replication target.
#
# Provenance: ~/git/baselines/rldp (authors' PyTorch, ICLR-2026 submission) + its paper,
# extracted in docs/notes/2026-08-28-rldp-paper-eval.md and audited against this seam in
# docs/notes/2026-08-28-rldp-audit.md. The audit's headline: critic/rldp.yaml is a faithful
# transcription of *td_jepa's* RLDP, which is a SINGLE-PHASE JOINT algorithm; the official
# repo is TWO-PHASE with a frozen backward map. This file turns on the six knobs that
# convert one into the other. Every knob defaults off, so critic/rldp.yaml is untouched and
# remains the td_jepa arm.
#
# The six (spec item A):
#  1 rldp_two_phase   phase 1 = SP + ortho over backward+predictor only, no FB loss and no
#                     actor; phase 2 = FB loss with B, the predictor and their optimizers
#                     frozen.                                    agent.py:167-243
#  2 rldp_pred_norm   sqrt(d)-normalize the predictor output at every unroll step.
#                                                                nn_models.py:324-332
#  3 rldp_actor_pessimism  actor maximizes mean - 0.5*unc over the F ensemble. agent.py:392
#  4 rldp_hard_b_target     phase-1 B target = hard copy every 250 steps (not a polyak);
#                     phase-2 F target polyak tau 0.01.          agent.py:196-197, 240
#  5 rldp_no_left_encoder   identity left encoder: F consumes the raw observation.
#  6 rldp_sp_official_scale SP = per-step mean over (B, z) SUMMED over h, not
#                     mean-over-batch of the z-sum divided by h. Reweights SP against
#                     ortho by z_dim/h.                          agent.py:269-271
rldp_two_phase: true
rldp_phase1_steps: 2_000_000   # paper text: 2M SP + 3M FB. The CODE default is 3M+3M
                               # (examples/rldp_train_dmc.py:142) -- recorded as the
                               # `steps-3M` ablation, see the spec's §4 failure ladder.
rldp_pred_norm: true
rldp_actor_pessimism: 0.5
rldp_hard_b_target: 250
rldp_no_left_encoder: true
rldp_sp_official_scale: true
# The paper's Eq-7 ortho (offdiag + diag). The official CODE optimizes only
# `ortho_coef * orth_loss_diag` (agent.py:270) -- the off-diagonal whitening is computed
# for logging and never enters the objective, so under a sqrt(d)-normalized B the term is
# inert. We follow the PAPER and keep the code-exact variant one flag away.
rldp_ortho_inert: true
# The FB TD target is built from the ONLINE backward map, as official RLDP does
# (`target_B = self._model._backward_map(goal)`, agent.py::update_fb). Its
# _target_backward_map is a PHASE-1-ONLY object -- the SP target in update_mr, refreshed
# there by the hard copy above -- and update_fb never reads it.
# NOT COSMETIC. Measured A/B from one shared 2M checkpoint, phase 2 only, this flag the
# only difference (dmc-walker, 50k steps):
#     target tower : fb_loss   256 ->  30,650   (geometric, doubling every ~5k steps)
#     online tower : fb_loss   227 ->     437   (flat, q_mean decelerating)
# With B frozen in phase 2 and the target tower stuck wherever phase 1's last hard copy
# left it, the residual F^T B_online - gamma F_target^T B_target compares two different
# bases forever; the linear -mean(diag(diff)) term then grows F along directions the
# off-diagonal quadratic never penalizes. One basis makes it an ordinary TD residual.
rldp_fb_target_online_b: true
ortho_coef: 1.0

# Architecture / optimization, from the official ExoRL example.
batch_size: 1024
z_dim: 512
L_dim: 512          # unused: rldp_no_left_encoder pins the F input to the raw obs width
num_parallel: 2
discount: 0.98      # 0.99 for point-mass-maze — set per domain in the launcher
f_target_tau: 0.01
b_target_tau: 0.01  # phase 1 uses the hard copy above; this is the joint-mode fallback
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
horizon: 5
forward:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2
backward:
  hidden_dim: 256
  hidden_layers: 2
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
  identity: true
predictor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
dataset_class: WindowedDataset

# ── NETWORKS (docs/notes/2026-08-30-rldp-network-audit.md) ─────────────────────────────
# The six knobs above make the LOSSES and the SCHEDULE official's. They do not touch the
# MODULES, which were td_jepa's -- and that, not the losses, is what produced an
# action-blind critic and a fully saturated policy in runs 1 and 2.
#   B         -> nn_models.BaseMLP        (Linear->LayerNorm->ELU twice, Linear, sqrt(d))
#   predictor -> EncoderMap.model_unroll  (elu(Linear(a)) -> BaseMLP -> Linear, single)
rldp_official_nets: true
rldp_za_dim: 256          # archi.b.za_dim
# Official draws phase-1 segment starts from [0, L-H] so a window never clamps at a
# trajectory end; the shipped sampler clamps, repeating the terminal state and feeding the
# SP head "nothing moved" targets.
rldp_no_clamp_windows: true

# OPTIMIZERS. Official builds THREE (agent.py:66-82): the encoder one is
# `AdamW(_backward_map.parameters(), lr=lr_b, weight_decay=1e-4)` -- hard-coded, not a
# config knob -- while the forward and actor optimizers are plain `Adam` at
# `cfg.train.weight_decay`, which defaults to 0.0. Official's `_backward_map` IS the whole
# EncoderMap, so its single optimizer covers what the seam splits into `backward` and
# `predictor`; naming both here reproduces it (Adam/AdamW state is per-parameter, so one
# optimizer over two param sets equals two over one each at identical settings).
group_adamw: [backward, predictor]
group_weight_decay: {backward: 1.0e-4, predictor: 1.0e-4}
