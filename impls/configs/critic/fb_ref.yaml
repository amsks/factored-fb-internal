# FB (Forward-Backward) critic defaults at cube-single launch values.
# Mirrors impls/main.py:get_config() (PR1's flat config) exactly.
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 1000.0
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
# Touati parity knobs (impls/critics/fb.py field comments). Defaults keep every prior cell
# bit-identical; the paper arm passes q_loss_coef=1/z_dim and both pessimism knobs 0.5.
q_loss_coef: 0.0
actor_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
  identity: false   # true = no encoder, F reads raw obs (Touati parity)

# ── AUDIT ARM (2026-09-02) ────────────────────────────────────────────────────────────────
# critic/fb.yaml with ortho_coef 1000 instead of 1.0. The reference stack ran BOTH:
#   Tuned FB              ortho_coef 1.0 (domain yaml)  cube-single 0.42
#   FB (reference reimpl) ortho_coef 1000              cube-single 0.532
# (scripts/rescuing_fb/launch_missing_baselines.sh on origin/gciql-fb-bridge; the 10-seed 1M
# plain-FB campaign used ortho_coef=1000 lr_b=1e-4 -- launch_bridge_10seed_1M.sh:79.)
#
# Our jax FB at ortho_coef 1.0 scores 0.11, against the torch Tuned-FB arm's 0.42 at the
# SAME setting -- so ortho_coef is NOT the gap. This arm is a data point, not a fix: if it
# lands near 0.53 the jax port is fine and only the default was wrong; if it stays near 0.11
# the divergence is in the implementation and this rules the knob out.
