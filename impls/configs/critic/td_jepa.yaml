# TD-JEPA (arXiv:2510.00739) at the OGBench settings of this tree.
#
# Critic: impls/critics/td_jepa.py (transcribed from
# ~/git/baselines/td_jepa/metamotivo/agents/td_jepa @ 840a745). Two encoders phi and psi,
# two predictors that roll them one step forward conditioned on (z, a), each regressing a
# TD target built from the OTHER encoder at the next state. Q = <Pred_phi(phi(s),z,a), z>;
# the task vector is the least-squares solve of reward samples on psi, sqrt(d)-normalized.
#
# Values below are TDJEPAAgentTrainConfig / TDJEPAModelArchiConfig defaults except where a
# line says otherwise. The three that follow this tree's OGBench convention rather than the
# reference's DMC defaults -- batch 256, discount 0.99, and the network widths -- match
# critic/rldp.yaml and critic/fb.yaml exactly, so `td_jepa` sits in the same protocol as
# every other OGBench cell. critic/td_jepa_tdj.yaml is the DMC arm at their own values.

batch_size: 256           # this tree's OGBench value (reference default 1024)
z_dim: 50                 # = psi_dim
tdjepa_phi_dim: 50        # archi.phi_dim
num_parallel: 2
discount: 0.99            # this tree's OGBench value (reference default 0.98)
norm_z: true
train_goal_ratio: 0.5

# Both orthonormality coefficients are 1.0 in the reference (phi_ortho_coef,
# psi_ortho_coef). They are read through ortho_coef so a sweep can move both at once;
# tdjepa_phi_ortho_coef / tdjepa_psi_ortho_coef split them.
ortho_coef: 1.0

# encoder_target_tau / predictor_target_tau, both 0.005. They arrive through the seam's
# b_target_tau / f_target_tau names so the existing polyak plumbing needs no new keys.
b_target_tau: 0.005       # encoders (phi_enc, psi_enc)
f_target_tau: 0.005       # predictors (phi_pred, psi_pred)

# lr_predictor / lr_phi / lr_psi / lr_actor are all 1e-4 in the reference. The encoders
# ride lr_b and the predictors lr_f (impls/agents/__init__.py::_LR_KEY).
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4

# predictor_pessimism_penalty / actor_pessimism_penalty, both 0.0 -> plain mean over the
# ensemble on the TD target and in the actor's Q.
tdjepa_predictor_pessimism: 0.0
tdjepa_actor_pessimism: 0.0

# phi_mlp_encoder / psi_mlp_encoder are BackwardArchiConfig; this tree builds that family
# as PhiMap, and both encoders read the `backward` block.
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
# phi_predictor / psi_predictor are ForwardArchiConfig; both read the `forward` block.
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
