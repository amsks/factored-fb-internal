# rldp_density_reg -- rldp_density + LEVER 3 (2026-09-12): density_fb's REGRESSION task index.
# impls/critics/rldp_density.py module docstring, "levers". Everything above the appended
# block is critic/rldp_density.yaml verbatim.
#
# Config-only alias: --critic rldp_density_reg builds the SAME RLDPDensityCritic class
# (impls/agents/__init__.py::CRITIC_ALIASES).
# Density-RLDP — RLDP's representation learner (SP + ortho, B out of the successor loss)
# with Density-FB's categorical successor estimator and reward-integrating q_fn. See
# impls/critics/rldp_density.py for the objective and the two lattice refusals
# (fb_pessimism_penalty must stay 0; temp must be > 0).
#
# Everything except the four density knobs at the bottom is critic/rldp.yaml verbatim —
# the whole point of the arm is that ONLY the successor estimator changes.
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 0.01
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0   # lattice-refused if nonzero (distribution targets are headwise)
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4              # the `predictor` group rides this (impls/agents/__init__.py::_LR_KEY)
lr_actor: 1.0e-4
horizon: 5
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
predictor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2

# ── density knobs (impls/critics/rldp_density.py) ──────────────────────────── #
temp: 1.0                 # softmax temperature of the successor density (density_fb default)
actor_temp: null          # null => temp; the actor readout may flatten its own softmax (W2)
actor_q_center: true      # spec-19a lattice: FlowBC/FQL normalizer sees the CENTERED spread

dataset_class: WindowedDataset

# ── LEVER 3: the regression task index ────────────────────────────────────── #
# Training tasks are built the way density_fb builds them: each row's goal is the batch's
# hindsight actor goal, its reward on the batch's candidate next states is the query-set-
# normalized kernel over the hit-spec object columns, and z is the ridge regression of that
# reward on the CENTERED features of a slow EMA copy of B at the stored running moments
# (density_fb's _z_centered_moment / _z_centered_coef / _z_centered_index, reused). Half
# the rows (train_goal_ratio above) keep that index, the rest are sphere draws. The actor
# reward is (B_slow(u) - mu_hat)^T z / sqrt(d); F conditions on the same map at the value
# goal; infer_cond / map_eval_cond go through the SAME solve.
rldp_density_task_index: regression
measure_hit_spec: "19:22:0.4"     # cube-single: the cube xyz block, env success radius
                                  # (quoted; per-env override exactly as for density_fb)
# density_fb's round-1 index knobs, same names under this critic's prefix.
rldp_density_z_ridge_lambda_mult: 0.01   # lam = mult * tr(C_hat)/d
rldp_density_z_cov_eig_floor: 1.0e-6     # eigenvalue floor on C_hat, x tr(C)/d
rldp_density_z_const_eps: 1.0e-6         # constant-reward fallback threshold on ||c||
rldp_density_z_enc_tau: 0.0005           # EMA rate of the slow index tower (backward_zenc)
rldp_density_z_sigma_tau: 0.005          # EMA rate of mu_hat / C_hat (rldp_zstats)
rldp_density_z_eval_pool_m: 256          # frozen eval pool for map_eval_cond (<= batch_size)

# The hindsight goals: WindowedDataset keeps the h-step SP window and ALSO emits GCDataset's
# value_goals / actor_goals (impls/utils/datasets.py::WindowedDataset, windowed_goal_sampling),
# at density_fb's goal-sampling settings -- actor goals are a uniform future state of the
# SAME trajectory (actor_p_trajgoal 1.0, no current/random goals), value goals the
# 0.2 / 0.5 / 0.3 current / geometric-future / random mix.
windowed_goal_sampling: true
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
