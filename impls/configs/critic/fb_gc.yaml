# fb_gc -- plain FB with train_goal_ratio 1.0: every training row is conditioned on
# z = B(hindsight goal), so the actor is extracted as a pure goal-reacher (goal-conditioned
# training for vanilla FB). 2026-09-16. The FB analogue of rldp_gc / hilp_gc.
#
# This is critic/fb.yaml at its cube-single launch values, changed in exactly ONE line:
# the hindsight-goal mixing fraction (impls/critics/fb.py:197-198, where a row's z is set to
# B(goal) when the mask fires and to a random Gaussian z otherwise). At 1.0 every row fires,
# so z is always the backward embedding of a future state on the same trajectory. At eval the
# single test goal is mapped the same way (fb.py:97 map_eval_cond, z = project_z(B(goal))),
# so this is goal-conditioned training AND goal-conditioned eval -- the FB member of the
# route-3 (GCRL) comparison next to the density_fb goal arm.
#
# Full state, no privileged object coordinates (no backward_input=hit_spec), to match the
# density_fb goal arm's raw-goal conditioning and rldp_gc / hilp_gc (backward_input: state).
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 1.0
train_goal_ratio: 1.0        # <-- the only change from critic/fb.yaml (0.5): pure goal-conditioned
fb_pessimism_penalty: 0.0
q_loss_coef: 0.0
actor_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
  identity: false
