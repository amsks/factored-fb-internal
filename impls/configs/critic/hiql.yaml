# HIQL critic — hierarchical IQL. Values mirror vendored hiql.py:get_config().
# Seam mapping: this critic owns goal_rep + the IVL value head + the HIGH-level actor;
# the seam actor is HIQL's LOW-level actor (impls/critics/hiql.py).
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.7
high_alpha: 3.0          # AWR temperature for the high-level policy
high_actor_hidden_dims: [512, 512, 512]   # the critic's own high-level policy
high_const_std: true
rep_dim: 10              # subgoal representation width (vendored rep_dim)
subgoal_steps: 25        # HGCDataset low-level goal horizon
low_actor_rep_grad: false  # true is refused: the rep is computed outside any grad here

# dataset — HIQL needs the hierarchical goal sampler
dataset_class: HGCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
