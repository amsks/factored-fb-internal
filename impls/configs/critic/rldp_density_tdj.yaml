# Density-RLDP at td_jepa's DMC settings -- the density ablation on the rldp_tdj substrate.
#
# THE POINT OF THIS FILE: it is critic/rldp_tdj.yaml verbatim plus the five density knobs
# at the bottom. Nothing else differs, so `rldp_density_tdj` vs `rldp_tdj` isolates the
# successor ESTIMATOR and nothing else.
#
# Why RLDP is the right substrate for that claim (impls/critics/rldp_density.py): RLDP's
# backward map B is trained ENTIRELY by the self-predictive rollout and the orthonormality
# term -- the successor loss detaches B (rldp.py divergence 1). So replacing the squared
# Bellman residual on m = F^T B with the categorical cross-entropy on
#
#     p_h(j | s_i, a_i, z_i) = softmax_j( F_h(L(s_i), z_i, a_i)^T sg[B(s'_j)] / temp )
#
# changes the estimator and leaves B's training signal bit-identical between the two arms.
# A gradient-isolation test pins that.
#
# HARD variant. The target is (1 - d_i) onehot(i) + d_i sg[pbar], d_i = gamma(1 - term_i):
# a Dirac on the observed successor. The soft/kernel variant needs a hit-spec over object
# coordinates, which walker does not have, so the hard/soft distinction does not apply on
# DMC.
#
# ortho_coef stays at rldp_tdj's 0.01 (the middle of td_jepa's sweep_walker). Since B is
# shaped by SP + ortho identically in both arms, that value carries over untouched rather
# than becoming a knob we tuned on our side.

batch_size: 1024          # DMC launcher (ogbench uses 256)
z_dim: 50
L_dim: 256                # DMC launcher (ogbench uses 50)
num_parallel: 2
discount: 0.98            # DMC launcher (ogbench uses 0.99)
f_target_tau: 0.001       # DMC launcher (FBAgentTrainConfig default is 0.01)
b_target_tau: 0.001
ortho_coef: 0.01          # middle of sweep_walker's {0.001, 0.01, 0.1}
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4              # the `predictor` group rides this
lr_actor: 1.0e-4
horizon: 5

# Architectures: DMC launcher BASE_CFG.agent.model.archi.
forward:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2
backward:
  hidden_dim: 256
  hidden_layers: 2
  norm: true
left_encoder:
  hidden_dim: 256
  hidden_layers: 0        # "shallow" left encoder, the launcher's default
  norm: true
predictor:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2     # our module needs it; td_jepa's predictor has no such knob,
                          # so this is critic/rldp.yaml's value, not a reference value

# Single joint objective -- td_jepa's RLDP has NO representation/FB phase split
# (no representation_steps anywhere; agents/rldp/agent.py:188 adds the ortho term
# straight into fb_loss every step). This is what makes a 500k comparison meaningful
# at all: under the official repo's two-phase schedule no actor exists before 2M.
rldp_two_phase: false
rldp_ortho_inert: false

# horizon 5 needs the windowed sampler (critic/rldp.yaml carries the same line).
dataset_class: WindowedDataset

# ---- density knobs (the ONLY additions over critic/rldp_tdj.yaml) ----
temp: 1.0                 # softmax temperature of the successor density (density_fb default).
                          # Pinned, NOT rescaled for z_dim 50. ||B|| = sqrt(50) ~ 7.07 here
                          # against sqrt(512) ~ 22.6 in every prior density arm, so the same
                          # temp admits ~3.2x smaller logits -- but F is learned and rescales,
                          # and inventing a tuned temp would put a fitted knob on our side of
                          # a comparison whose whole value is that only the estimator differs.
                          # If this arm underperforms, sweep temp THEN, informed by the miss.
actor_temp: null          # null => temp; the actor readout may flatten its own softmax
actor_q_center: true      # spec-19a lattice: the FlowBC/FQL normalizer sees the CENTERED spread
# fb_pessimism_penalty is inherited from the substrate (already 0.0 there). It is
# lattice-REFUSED for this critic rather than merely defaulted: mean-minus-uncertainty
# over per-head distributions can leave the simplex, so a nonzero value raises at build.
