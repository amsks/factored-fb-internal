# GCIQL critic — expectile V + twin-Q TD. Values mirror vendored gciql.py:get_config().
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.9
q_bound: 0.0      # >0: squash V and Q to |.| <= q_bound via kappa*tanh(x/kappa) — the
                  # bounded-monolithic control (phenomenon.tex Pred. mech.1). 0 = vendored.

# dataset (GCDataset goal sampling)
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
