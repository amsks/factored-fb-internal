# PSM (Proto Successor Measure) critic.
#
# Values carried over from the PyTorch reference's configs/agent/psm.yaml (the sweep-best
# PSM config on this repo's cube runs), EXCEPT where this seam's cube-single convention
# already fixes the number -- those are flagged inline. See impls/critics/psm.py for the
# transcription notes and the two deliberate deviations (threefry proto sampler; no
# encoder on the state path).
batch_size: 256          # seam cube-single convention (critic/fb.yaml); reference used 1024
discount: 0.99           # seam cube-single convention (critic/fb.yaml); reference used 0.98
z_dim: 128               # reference PSM basis
max_log_seed: 16         # width of the proto (binary) code
num_parallel: 2
norm_z: true
target_tau: 0.01         # reference PSM basis (polyak for phi / sf_psi / psm_psi)
ortho_coef: 1.0
mix_ratio: 0.5           # fraction of z rows replaced by project_z(phi(shuffled next_obs))
pessimism_penalty: 0.0        # measure-target uncertainty penalty (both stages)
actor_pessimism_penalty: 0.5  # Q-readout uncertainty penalty (reference _update_td3_actor)
# Fixed, NOT seed-derived: the reference's proto action table is a constant of the code,
# so the proto policy family must be identical across run seeds. Change it only to ablate
# the choice of proto behaviour family.
proto_seed: 0

# phi (basis) -- reference phi_cfg
phi:
  hidden_dim: 256
  hidden_layers: 2
  norm: true

# sf_psi / psm_psi (successor nets) -- reference sf_cfg
sf:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2

lr_sf: 1.0e-4
lr_phi: 1.0e-5           # reference sweep winner (ortho_coef=1 x lr_phi=1e-5)
lr_actor: 1.0e-4
