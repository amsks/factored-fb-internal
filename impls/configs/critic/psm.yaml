# PSM (Proto Successor Measure) critic — dual-psi (proto + SF) FB. z-critic, FB dataset.
batch_size: 256
z_dim: 128
num_parallel: 2
discount: 0.98
f_target_tau: 0.005
ortho_coef: 1.0
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
