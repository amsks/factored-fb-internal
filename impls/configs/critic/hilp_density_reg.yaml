# hilp_density_reg — Density-HILP on the td_jepa-exact cube substrate WITH the regression
# task index (the Density-RLDP LEVER 3, ported 2026-09-13).
#
# `hilp_density_tdjc.yaml` VERBATIM (the campaign column) plus the regression block and the
# hindsight goal-sampling keys at the bottom. Default-off in the critic, so hilp_density_tdjc
# itself is bit-identical; this file is the only place the lever is on at state input.
# The object-coordinate phi-input variant is hilp_density_reg_oc.yaml.

batch_size: 256
z_dim: 50
L_dim: 50                  # archi.L_dim — the left encoder's output width
num_parallel: 2
discount: 0.99
hilp_discount: 0.99        # td_jepa uses ONE train.discount for the phi loss and the SF target
norm_z: true
phi:
  hidden_dim: 512
  hidden_layers: 4         # archi.features = BackwardArchi(512, 4)
hilp_expectile: 0.5
phi_target_tau: 0.005      # train.features_target_tau
hilp_stats_momentum: 0.005 # center_features EMA
feature_type: state
sf:
  hidden_dim: 512          # archi.successor_features = ForwardArchi(512, 2)
  hidden_layers: 2
  embedding_layers: 2      # ForwardArchiConfig.embedding_layers default
hilp_sf_archi: tdjepa      # generic ForwardArchi, per-head embeddings + hidden_layers trunk
hilp_left_encoder:         # archi.left_encoder = BackwardArchi(512, 4, norm=True) -> L_dim
  hidden_dim: 512
  hidden_layers: 4
  norm: true
sf_target_tau: 0.005       # train.sf_target_tau (also the left encoder's target tau)
hilp_q_loss: false
hilp_head_reduce: mean
hilp_actor_head_reduce: mean
hilp_sf_loss_scale: 0.5
lr_f: 1.0e-4               # train.lr_sf — the SF tower AND the left encoder ride this
lr_b: 1.0e-4
lr_actor: 1.0e-4           # train.lr_actor
group_lr: {hilp_phi1: 1.0e-4, hilp_phi2: 1.0e-4, actor: 1.0e-4}   # train.lr_features
dataset_class: HILPFutureDataset
hilp_future: 0.99          # data.future
hilp_p_randomgoal: 0.375   # train.prob_random_goal
hilp_p_currgoal: 0.0
hilp_mix_ratio: 0.5        # train.train_goal_ratio
stages_from_pre_step_params: true
hilp_independent_target_init: false   # td_jepa deepcopies its targets AFTER weight_init
backward_input: state
measure_hit_spec: "19:22:0.4"     # cube-single; cube-double overrides to add 28:31:0.4

# --- the three density knobs ---
measure_density_temp: 1.0
measure_density_actor_temp: null
actor_q_center: true

# ---- the regression task index (impls/critics/hilp_density.py module docstring) ----
# The Density-RLDP LEVER 3 on the HILP substrate: for each row the goal is the dataset's
# hindsight goal, its reward on the batch's candidate next states is the query-set-
# normalized object-coordinate kernel over measure_hit_spec, and z is density_fb's
# centered ridge regression of that reward on a slow EMA copy of phi (mu_hat / C_hat
# EMA'd). hilp_mix_ratio (0.5, above) is the fraction of rows that keep that index; the
# rest are sphere draws. infer_cond and map_eval_cond go through the same solve.
hilp_density_task_index: regression
hilp_density_z_ridge_lambda_mult: 0.01   # lam = mult * tr(C_hat)/d
hilp_density_z_cov_eig_floor: 1.0e-6     # eigenvalue floor on C_hat, x tr(C)/d
hilp_density_z_const_eps: 1.0e-6         # constant-reward fallback threshold on ||c||
hilp_density_z_enc_tau: 0.0005           # EMA rate of the slow index tower (hilp_phi_zenc)
hilp_density_z_sigma_tau: 0.005          # EMA rate of mu_hat / C_hat (hilp_zstats)
hilp_density_z_eval_pool_m: 256          # frozen eval pool for map_eval_cond (<= batch_size)
# HILPFutureDataset ALSO emits GCDataset's value_goals / actor_goals under this flag (the
# geometric phi-loss future draw is untouched). Same GC keys as critic/rldp_density_reg.yaml:
# the actor leg is a strictly-future state of the same trajectory, the value leg the
# OGBench mix.
hilp_goal_sampling: true
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
