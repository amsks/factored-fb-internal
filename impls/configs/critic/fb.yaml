# Forward-Backward at the TD-JEPA settings (impls/critics/fb.py).

# Optimisation
batch_size: 256
discount: 0.99
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
f_target_tau: 0.005
b_target_tau: 0.005

# Representation
z_dim: 50
L_dim: 50
num_parallel: 2
norm_z: true
ortho_coef: 1000.0
train_goal_ratio: 0.5

# Networks
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
