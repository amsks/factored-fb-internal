# HILP critic (impls/critics/hilp.py) at TD-JEPA's OGBench settings
# (td_jepa scripts/train/proprio/launch_sf_ogbench.py). Run with --actor flowbc.
batch_size: 256
z_dim: 50
L_dim: 50                  # width of the left encoder that the successor features read
num_parallel: 2
discount: 0.99             # successor-feature TD
hilp_discount: 0.99        # phi value TD
norm_z: true
phi:
  hidden_dim: 512
  hidden_layers: 4
hilp_expectile: 0.5        # 0.5 makes the phi loss a plain squared error
phi_target_tau: 0.005
hilp_stats_momentum: 0.005 # EMA rate of the phi mean subtracted from the features
sf:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
hilp_left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
sf_target_tau: 0.005       # successor features and left encoder
hilp_sf_loss_scale: 0.5
lr_f: 1.0e-4               # successor features and left encoder
lr_b: 1.0e-4
lr_actor: 1.0e-4
group_lr: {hilp_phi1: 1.0e-4, hilp_phi2: 1.0e-4, actor: 1.0e-4}
hilp_mix_ratio: 0.5        # fraction of training z that are whitened feature directions
# Goal sampling for the phi loss (HILPFutureDataset).
dataset_class: HILPFutureDataset
hilp_future: 0.99          # geometric future-goal distribution
hilp_p_randomgoal: 0.375
# Every stage's loss is computed from the pre-step parameters; all are stepped together.
stages_from_pre_step_params: true
