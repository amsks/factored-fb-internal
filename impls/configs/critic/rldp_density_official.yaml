# Density-RLDP at OFFICIAL RLDP parity — the phase-2 arm of the replication campaign.
#
# critic/rldp_official.yaml verbatim (same six knobs, same architecture, same optimizer),
# with ONLY the successor estimator swapped for Density-FB's categorical one. That is the
# whole point of the arm: every difference from the vanilla cell is the estimator.
#
# The two-phase schedule composes with the CE estimator unchanged. RLDPDensityCritic
# already trains F and the encoder only -- it leaves the backward map entirely to the
# host's representation loss -- so the phase-2 B-freeze removes an optimizer step that was
# already a no-op for this critic's own loss. Gradient isolation verified in
# docs/notes/2026-08-28-rldp-audit.md.
#
# GATED: this config is only run once the vanilla rldp_official cell passes its
# replication gate (spec §4, phase 2).
rldp_two_phase: true
rldp_phase1_steps: 2_000_000   # paper text: 2M SP + 3M FB. The CODE default is 3M+3M
                               # (examples/rldp_train_dmc.py:142) -- recorded as the
                               # `steps-3M` ablation, see the spec's §4 failure ladder.
rldp_pred_norm: true
rldp_actor_pessimism: 0.5
rldp_hard_b_target: 250
rldp_no_left_encoder: true
rldp_sp_official_scale: true
# The paper's Eq-7 ortho (offdiag + diag). The official CODE optimizes only
# `ortho_coef * orth_loss_diag` (agent.py:270) -- the off-diagonal whitening is computed
# for logging and never enters the objective, so under a sqrt(d)-normalized B the term is
# inert. We follow the PAPER and keep the code-exact variant one flag away.
rldp_ortho_inert: false
ortho_coef: 1.0

# Architecture / optimization, from the official ExoRL example.
batch_size: 1024
z_dim: 512
L_dim: 512          # unused: rldp_no_left_encoder pins the F input to the raw obs width
num_parallel: 2
discount: 0.98      # 0.99 for point-mass-maze — set per domain in the launcher
f_target_tau: 0.01
b_target_tau: 0.01  # phase 1 uses the hard copy above; this is the joint-mode fallback
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
horizon: 5
forward:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2
backward:
  hidden_dim: 256
  hidden_layers: 2
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
  identity: true
predictor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
dataset_class: WindowedDataset

# ── density knobs (impls/critics/rldp_density.py) ──────────────────────────── #
temp: 1.0                 # softmax temperature of the successor density (density_fb default)
actor_temp: null          # null => temp
actor_q_center: true      # centered spread for the actor normalizer
