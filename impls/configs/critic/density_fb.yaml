# density_fb critic — the continuous normalized successor density (bridge spec 18).
# One-stage, from-scratch, two-tower softmax density f(s,a,g,u) = F(s,a,g)^T B(u) / tau
# over a query support resampled every update from the batch's own next-state object
# coords. Cube-single 0.929 on origin/gciql-fb-bridge @ 542c058
# (tools/wandb_mode_shim/gciql_flow.py). Knob names kept verbatim from that file for
# greppability. NO ortho, NO mass anchor, NO scale norm on this path (impls/critics/
# density_fb.py — each was separately measured harmful on the bridge).
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
# B-tower width/depth, when it must differ from F. null = same as value_hidden_dims (what
# every published cell ran). Meta Motivo's humanoid sizes them asymmetrically -- f 1024x2,
# b 256x1 -- so matching that config needs this knob.
measure_density_b_hidden_dims: null
layer_norm: true
discount: 0.99
tau: 0.005                        # polyak rate for BOTH density_f/density_b targets
measure_hit_spec: "19:22:0.4"     # cube-single default; "a:b:eps" blocks, comma-joined for a conjunction
measure_density_dim: 50
measure_density_temp: 1.0
measure_density_hard: true        # DEFAULT since 2026-08-16 (bridge-port spec A2). Immediate
  # term = one-hot at the row's own successor (k = I, M == B) instead of the eps-kernel
  # softmax; attributes smoothing vs simplex-TD. Bridge verdict "the hard variant is the one
  # to ship" (DENSITY-FB-EXPLAINED.md @ b811ea8: cube-single 0.912 hard vs 0.725 soft, and
  # hard wins zero-shot transfer decisively). Every existing table cell already ran with the
  # override on (tags `densityhard*`), so flipping the default changes NO published number --
  # it only stops a future launch from silently getting the losing variant. Set false to
  # reproduce the soft ablation. Actor q-readout (q_fn's kg) is UNCHANGED by this knob --
  # only stage_loss's immediate CE target moves.
# Known gap (spec §2): the bridge centers the actor's Q-loss NORMALIZER; our FlowBCActor
# has no such knob, so this is implemented inside q_fn as batch-mean subtraction of Q
# instead — composes with the actor's own sg[|Q|.mean()] normalization.
actor_q_center: true

# --- edge-attribution knobs (docs/specs/2026-08-17-gciql-edge-attribution.md) -------------
# Both default to the pre-existing behaviour, so every published cell is unaffected.
#
# W1/M1. `actor` bootstraps the TD target at the actor's action a+ ~ pi(.|s', g_value), which
# puts the actor INSIDE the critic's fixed point — the confirmed cause of the mw-pick-place
# collapse. `sarsa` bootstraps at the dataset's own next action (batch['next_actions'], served
# by GCDataset), which is GCIQL's in-sample-backup property with the kernel readout intact.
# That difference is what separates M1 from M2; it is not a mitigation knob.
measure_density_bootstrap: actor    # actor | sarsa
# W2/M2. Temperature for the ACTOR READOUT ONLY (q_fn's softmax). null -> measure_density_temp
# (bit-identical). stage_loss's CE target always uses measure_density_temp, so raising this
# smooths what the actor ascends without changing what the measure is trained to be.
measure_density_actor_temp: null
# 2026-09-19: how the actor's readout combines the two F heads. 'min' (default, what every
# published cell ran) is the TD3 pessimistic min; 'mean' matches the FB reference actor
# (critic/fb.yaml actor_pessimism_penalty 0 = mean over heads). stage_loss is untouched.
measure_density_actor_head_reduce: min    # min | mean

# --- Meta Motivo NETWORK SHAPES -----------------------------------------------------------
# "mlp" (default) is what every published cell ran: one ensembled MLP over the concatenation
# [obs, action, cond] for F, one MLP over the query block for B.
#
# "motivo" is metamotivo/nn_models.py's own ForwardMap/BackwardMap. F becomes TWO embedding
# branches -- over (obs, cond) and over (obs, action) -- each narrowing to hidden_dim//2 and
# concatenated back to hidden_dim, then a trunk. This is a different SHAPE, not a width: our
# [1024, 1024] is two 1024 layers over one concatenation, theirs is four layers in a Y.
# Under "motivo", value_hidden_dims and measure_density_b_hidden_dims are read as their
# (hidden_dim, hidden_layers) pair, so every entry must be equal and the LENGTH is the layer
# count: [1024, 1024] -> width 1024 x 2 layers; [256] -> width 256 x 1 layer.
# Pair it with actor.motivo_archi, which does the same for the policy net.
measure_density_archi: mlp        # mlp | motivo
# Motivo's archi.b.norm: B's output projected onto the sqrt(d) sphere. Applied in `_B`, so
# it reaches the loss, the frozen target, the index encoder and the actor's reward vector
# alike. WARNING, and it is why this defaults false: this is the scale normalization
# docs/density-fb-design.md records as separately harmful on the bridge (the same family as
# the orthonormalization that took cube-single 0.967 -> 0.225). It exists to reproduce
# Motivo's config, not because it was expected to help.
measure_density_b_norm: false

# --- observation standardization (Meta Motivo `norm_obs`) ---------------------------------
# DEFAULT OFF, so every published cell is byte-identical. On, the per-dimension running
# mean/variance of the observation is applied wherever a network reads an observation -- F's
# observation leg, B's query input, and the policy net's observation leg -- reproducing
# Motivo's nn.BatchNorm1d(obs_dim, affine=False, momentum=0.01) in eval mode
# (metamotivo/fb/model.py:77, applied at forward_map/backward_map/actor).
#
# The HIT KERNEL IS NOT STANDARDIZED. Kernel coordinates stay in raw observation units, so
# measure_hit_spec's calibrated radius keeps meaning what it was calibrated to mean -- on
# hum-humanoid that is the benchmark's own success ball over next_obs[:214].
#
# Two things it does NOT normalize, for want of a reference to copy: F's CONDITIONING leg
# and the policy's conditioning leg under the goal-conditioned arm (a raw goal observation).
# Motivo's F takes (obs, z, action) with no goal leg at all, so there is nothing to match
# there. Under measure_density_z both legs are the sqrt(d)-normalized index already.
#
# Raises on pixels: the knob standardizes a vector per dimension, which an image is not.
norm_obs: false
norm_obs_momentum: 0.01   # new = (1-m)*old + m*batch, BatchNorm1d's momentum convention
norm_obs_eps: 1.0e-5      # BatchNorm1d's default eps, under the sqrt

# --- spec 30 P1: the REWARD-SAMPLE INDEX (impls/critics/density_fb.py) --------------------
# DEFAULT OFF. With it off nothing below is read and the critic is byte-identical to the
# goal-conditioned arm every published cell ran (tests/impls/test_boot_contract.py gates
# that over 60 critic x actor pairs).
#
# On, the policy family is indexed by a latent z inferred from REWARD SAMPLES
# {(u_j, r_j)}_{j=1..M} instead of by a goal, so `infer_cond(net, obs, rewards)` is a real
# zero-shot task interface. The only variant implemented is the SHIPPED spec-30 one -- the
# translation-gauge-invariant CENTERED DUAL encoder
#     zhat = sqrt(d) * norm( (C_hat + lam I)^-1 (1/M) sum_j (B(u_j)-mu)(r_j-rbar) )
# which is exactly invariant to r -> r + beta, r -> alpha r (alpha>0) and B -> B + b, and
# which REQUIRES M > 1 (it raises at M=1: the centered moment is identically zero there).
# Spec 24's sphere index, spec 29's uncentered dual, the analytic point/Dirac prompt and
# every orthogonality term are deliberately NOT ported.
#
# Turning it on WIDENS the actor's conditioning leg from obs_dim to measure_density_dim
# (critic.cvec_dim), so a checkpoint trained with it off cannot be restored with it on.
measure_density_z: false
measure_density_z_rand_frac: 0.5            # fraction of training rows whose index is a
  # fresh sqrt(d)-sphere draw instead of the encoded one -- FB's standard task-prior mix, so
  # the actor sees the whole conditioning sphere and not just the hindsight-reachable slice.
measure_density_z_ridge_lambda_mult: 0.01   # lam = mult * tr(C_hat)/d (the MEAN-EIGENVALUE
  # convention: dimensionless, comparable across checkpoints and towers).
measure_density_z_cov_eig_floor: 1.0e-6     # eigenvalues of C_hat below this multiple of
  # tr(C_hat)/d are lifted to it before the solve. The centered covariance of a d=50 tower
  # has genuinely near-zero directions (measured effective rank 6-21 of 50); an unfloored
  # inverse amplifies whatever numerical noise sits in them.
measure_density_z_enc_tau: 0.0005           # tau_z: EMA rate of density_b_zenc, the SLOW
  # copy of the backward tower that encodes the index. The centered encoder REQUIRES this
  # > 0 -- at 0 the index would be encoded with the fast-drifting target tower, which is the
  # known non-stationarity risk. Round-1 dose 0.0005 (10x slower than the critic tau).
measure_density_z_sigma_tau: 0.005          # EMA rate of the stored mu_hat / C_hat. These
  # are PERSISTENT leaves, not batch statistics: a per-batch d x d covariance would make the
  # index jitter step to step, and a batch statistic at eval would not be the object training
  # conditioned on.
measure_density_z_eval_pool_m: 256          # M for the FROZEN eval pool -- the reward-sample
  # API a native-goal eval goes through (goal -> r = kg(goal, pool) -> the same centered
  # solve), instead of shortcutting to an analytic point prompt. Drawn once from the first
  # update's next states, so it must be <= batch_size.
measure_density_z_const_eps: 1.0e-6         # CONSTANT-REWARD FALLBACK threshold on ||c||.
  # A reward that is (near-)constant on the pool carries no task information; below this the
  # index returns the all-ones vector (norm sqrt(d), so still in the conditioning
  # distribution) rather than normalizing noise into a confident-looking direction.

# dataset (GCDataset goal sampling) — same convention as critic/gciql.yaml
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
