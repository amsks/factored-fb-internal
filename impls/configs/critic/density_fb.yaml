# Goal-conditioned Density-FB (impls/critics/density_fb.py).

# Optimisation
lr: 3.0e-4
batch_size: 1024
discount: 0.99
tau: 0.005                  # target network update rate

# Networks
value_hidden_dims: [512, 512, 512]
backward_hidden_dims: null  # defaults to value_hidden_dims
layer_norm: true
archi: mlp                  # mlp or motivo
z_dim: 50
temperature: 1.0            # softmax temperature over F^T B
norm_backward: false
backward_input: hit_spec    # state or hit_spec (the goal_spec columns)

# Task
goal_spec: "19:22:0.4"      # start:stop:radius observation blocks, comma-joined
actor_value: softmax        # softmax or linear_fz
infer_z: false

# Goal sampling (GCDataset)
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
