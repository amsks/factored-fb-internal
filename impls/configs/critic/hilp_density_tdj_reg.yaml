# Density-HILP at td_jepa's DMC settings -- the density ablation on the hilp_tdj substrate.
#
# This is critic/hilp_tdj.yaml verbatim plus the density knobs at the bottom, so
# `hilp_density_tdj` vs `hilp_tdj` isolates the successor ESTIMATOR and nothing else.
# Every td_jepa parity fix (hilp_q_loss false, both head reductions mean, sf loss scale)
# is INHERITED from the substrate rather than restated here.
#
# HILP qualifies as a substrate for the same structural reason RLDP does: phi is learned
# entirely by the Hilbert/IQL value loss and the successor objective never touches it
# (stage_groups("sf") == ("hilp_sf",), and the SF loss reads phi through stop_gradient).
# See impls/critics/hilp_density.py for the objective.

batch_size: 1024
z_dim: 50
num_parallel: 2
discount: 0.98
norm_z: true
phi:
  hidden_dim: 512
  hidden_layers: 2
hilp_discount: 0.98
hilp_expectile: 0.5
phi_target_tau: 0.001      # td_jepa features_target_tau (official HILP: 0.005)
hilp_stats_momentum: 0.005
feature_type: state
sf:
  hidden_dim: 1024
  feature_dim: 512
  hidden_layers: 2
  embedding_layers: 2
sf_target_tau: 0.001       # td_jepa sf_target_tau (official HILP: 0.01)
hilp_q_loss: false        # td_jepa's SFAgentTrainConfig.q_loss default, which neither
                          # BASE_AGENT_CFG["hilp"] nor sweep_hilp_walker overrides. FALSE
                          # regresses the SF VECTOR (target_SF = next_phi + discount*next_SF,
                          # MSE over all z_dim components); TRUE regresses only the SCALAR
                          # Q = <psi, z>.
                          #
                          # This is not a stylistic difference. Under the scalar loss only
                          # psi's component ALONG z is constrained and the other 49
                          # directions are free, so psi collapses -- measured at 2.5-2.8
                          # effective dimensions of 50, with the surviving subspace nearly
                          # ORTHOGONAL between seeds (principal cosines 0.29/0.18/0.02).
                          # Q = <psi,z> then lives on a ~2-dim, seed-arbitrary surface and
                          # the actor optimises a different objective per seed: walker/spin
                          # came out 218 / 409 / 953 across three seeds.
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
dataset_class: HILPFutureDataset
hilp_future: 0.99
group_lr: {hilp_phi1: 1.0e-4, hilp_phi2: 1.0e-4, actor: 1.0e-4}   # td_jepa lr_features
hilp_p_randomgoal: 0.375
hilp_p_currgoal: 0.0
hilp_mix_ratio: 0.5
stages_from_pre_step_params: true
hilp_independent_target_init: true

# --- td_jepa parity: head reductions and loss scale ---
# All three default to OFFICIAL HILP's behaviour in impls/critics/hilp.py; td_jepa differs
# on every one, and every difference is theirs being NON-pessimistic where official HILP is
# pessimistic. Measured consequence of getting these wrong, together with hilp_q_loss:
# psi collapsed to 2.5-2.8 effective dimensions of 50 with a seed-arbitrary surviving
# subspace, and walker/spin came out 218 / 409 / 953 across three seeds.
hilp_head_reduce: mean          # sf_loss: get_targets_uncertainty(next_SFs, 0.0) = mean over heads
hilp_actor_head_reduce: mean    # update_actor: get_targets_uncertainty(Qs, 0.0) = mean over heads
hilp_sf_loss_scale: 0.5         # theirs is 0.5*P*mse_loss (mean over P*B*d); ours was 2x that

# ---- density knobs (the ONLY additions over critic/hilp_tdj.yaml) ----
temp: 1.0                 # softmax temperature; pinned, not rescaled for z_dim 50, for the
                          # same reason as rldp_density_tdj -- a tuned knob on our side
                          # would spoil a comparison whose value is that only the estimator
                          # differs.
actor_temp: null          # null => temp
actor_q_center: true      # the FlowBC/FQL normalizer sees the CENTERED spread

# ---- 2026-09-14: the regression task index (critic/hilp_density_reg.yaml block) ----
# This file = critic/hilp_density_tdj.yaml verbatim + this block. Same walker hit spec as
# rldp_density_tdj_reg.yaml (env/domains/dmc-walker.yaml, full 24-dim block, radius 15.9; quoted).
hilp_density_task_index: regression
measure_hit_spec: "0:24:15.9"
hilp_density_z_ridge_lambda_mult: 0.01   # lam = mult * tr(C_hat)/d
hilp_density_z_cov_eig_floor: 1.0e-6     # eigenvalue floor on C_hat, x tr(C)/d
hilp_density_z_const_eps: 1.0e-6         # constant-reward fallback threshold on ||c||
hilp_density_z_enc_tau: 0.0005           # EMA rate of the slow index tower (hilp_phi_zenc)
hilp_density_z_sigma_tau: 0.005          # EMA rate of mu_hat / C_hat (hilp_zstats)
hilp_density_z_eval_pool_m: 256          # frozen eval pool for map_eval_cond (<= batch_size 1024)
# HILPFutureDataset ALSO emits GCDataset's value_goals / actor_goals under this flag.
hilp_goal_sampling: true
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
