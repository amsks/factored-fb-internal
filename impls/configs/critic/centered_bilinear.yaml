# CenteredBilinear critic — behaviour-relative advantage on a bilinear head.
# mode='dueling' (default): Q = U(s,g) + A_bil(s,a,g), A_bil = (phi - b)·psi/sqrt(d),
# trained by expectile-V + twin-Q TD + a scale-normed baseline regression. The centered
# modes (centered_aux / centered_only) reuse the same b(s) baseline through a ΔM measure TD.
# IQL/head values mirror critic/iql_bilinear.yaml; mode knobs mirror the T10 bridge sweeps.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.9

# --- bilinear head ---
value_latent_dim: 512     # d; the rank of the goal bottleneck
double_q: true            # false ablates the clipped double-Q to the single head q1

# --- centering mode ---
mode: dueling             # dueling | centered_aux | centered_only
dueling_b_coef: 1.0       # weight on L_b = ||b - sg[phi(s,a_data)]||^2 (dueling only)
centered_measure_coef: 1.0  # lambda on the centered-measure ΔM TD leg (centered_* only)
center_b_coef: 1.0        # weight on the scale-normed b(s) regression (centered_* only)
center_b_samples: 1       # PINNED to 1: b(s) is estimated from the dataset behaviour action
                          # (the reference's K-flow-sample estimator is not reproducible on
                          # the factored seam). Any other value raises at build time.
centered_split_bootstrap: true  # centered_only: SARSA (dataset next action) on the base leg,
                          # pi bootstrap on the ΔM leg. Needs use_next_actions=True + a dataset
                          # that emits next_actions. false = pi bootstrap on both legs.
centered_scale_anchors: false   # centered_* scale control: sphere-Norm psi + raw base regression
use_next_actions: false   # explicit config key (audit S13) gating the dataset SARSA next action;
                          # replaces the reference's OGBENCH_NEXT_ACTIONS env var.

# dataset (GCDataset goal sampling) — identical to critic/iql_bilinear.yaml
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
