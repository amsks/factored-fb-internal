# rldp_density_full -- rldp_density with ALL THREE LEVERS on (2026-09-12): the CE trains B
# (lever 1), object-coordinate B input (lever 2 = critic/rldp_density_oc.yaml's
# backward_input: hit_spec) and density_fb's regression task index on hindsight goals
# (lever 3 = critic/rldp_density_reg.yaml). impls/critics/rldp_density.py module docstring.
# Everything above the appended block is critic/rldp_density.yaml verbatim.
#
# Config-only alias: --critic rldp_density_full builds the SAME RLDPDensityCritic class
# (impls/agents/__init__.py::CRITIC_ALIASES).
# Density-RLDP — RLDP's representation learner (SP + ortho, B out of the successor loss)
# with Density-FB's categorical successor estimator and reward-integrating q_fn. See
# impls/critics/rldp_density.py for the objective and the two lattice refusals
# (fb_pessimism_penalty must stay 0; temp must be > 0).
#
# Everything except the four density knobs at the bottom is critic/rldp.yaml verbatim —
# the whole point of the arm is that ONLY the successor estimator changes.
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 0.01
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0   # lattice-refused if nonzero (distribution targets are headwise)
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4              # the `predictor` group rides this (impls/agents/__init__.py::_LR_KEY)
lr_actor: 1.0e-4
horizon: 5
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
predictor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2

# ── density knobs (impls/critics/rldp_density.py) ──────────────────────────── #
temp: 1.0                 # softmax temperature of the successor density (density_fb default)
actor_temp: null          # null => temp; the actor readout may flatten its own softmax (W2)
actor_q_center: true      # spec-19a lattice: FlowBC/FQL normalizer sees the CENTERED spread

dataset_class: WindowedDataset

# ── LEVER 1: the CE trains B (critic/rldp_density_trainb.yaml) ─────────────── #
rldp_density_train_b: true

# ── LEVER 2: object-coordinate B input (critic/rldp_density_oc.yaml) ───────── #
backward_input: hit_spec
measure_hit_spec: "19:22:0.4"     # cube-single: the cube xyz block, env success radius
                                  # (one key serves the B input slice AND the kernel reward)

# ── LEVER 3: the regression task index (critic/rldp_density_reg.yaml) ──────── #
rldp_density_task_index: regression
rldp_density_z_ridge_lambda_mult: 0.01
rldp_density_z_cov_eig_floor: 1.0e-6
rldp_density_z_const_eps: 1.0e-6
rldp_density_z_enc_tau: 0.0005
rldp_density_z_sigma_tau: 0.005
rldp_density_z_eval_pool_m: 256
windowed_goal_sampling: true
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
