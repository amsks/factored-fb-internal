# FB (Forward-Backward) critic defaults at cube-single launch values.
# Mirrors impls/main.py:get_config() (PR1's flat config) exactly.
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 1.0
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0
# Touati parity knobs (impls/critics/fb.py field comments). Defaults keep every prior cell
# bit-identical; the paper arm passes q_loss_coef=1/z_dim and both pessimism knobs 0.5.
q_loss_coef: 0.0
actor_pessimism_penalty: 0.0
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
  identity: false   # true = no encoder, F reads raw obs (Touati parity)

# ── object-coordinate backward input (this _oc arm's ONE change) ───────────── #
# B consumes the eps-scaled hit-spec block slice of the observation instead of the full
# state, through the `_b_in` choke point in impls/critics/fb.py. Everything above is
# critic/fb.yaml verbatim, so fb_oc vs fb isolates the B-tower INPUT and nothing else.
#
# NOT the same as feat/goal-conditioned-fb's V2 `fixed_b=cube_xyz`, which replaced B with
# a fixed non-learned map and collapsed z_dim to 3 (cube-single 0.06 vs plain FB 0.50).
# Here B stays a learned PhiMap at the full z_dim 50 and only its INPUT narrows, so the
# latent-width confound that sinks every d<=5 arm is absent and this is the first clean
# test of "does FB benefit from privileged object coordinates".
backward_input: hit_spec
measure_hit_spec: "19:22:0.4"     # cube-single; cube-double overrides to "19:22:0.4,28:31:0.4"
