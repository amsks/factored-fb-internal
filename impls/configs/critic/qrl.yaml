# Quasimetric RL critic — IQE distance value + latent dynamics. Dual lambda. No targets.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
quasimetric_type: iqe
latent_dim: 512
dim_per_component: 8
layer_norm: true
eps: 0.05
discount: 0.99
dataset_class: GCDataset
value_p_curgoal: 0.0
value_p_trajgoal: 1.0
value_p_randomgoal: 0.0
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: false
