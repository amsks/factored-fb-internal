# density_fb_z: Density-FB with reward inference (impls/critics/density_fb.py).
# Same critic as density_fb.yaml, but the task is a latent z instead of a goal. z is
# inferred from reward samples by ridge regression of the reward on the centered slow
# backward features, and the actor maximises the linear reward (B_slow(u) - mu)^T z / sqrt(d)
# averaged under the predicted distribution over next states.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]   # F (two heads) and, by default, B
measure_density_b_hidden_dims: null  # B's hidden dims when they differ from F's
layer_norm: true
discount: 0.99
tau: 0.005                           # polyak rate of the target F and B
# Which observation columns define the training goals' reward and how close counts as
# reaching them: "start:stop:eps" blocks, comma-joined when every block must be reached.
measure_hit_spec: "19:22:0.4"
measure_density_dim: 50              # d, the width of F, B and z
measure_density_temp: 1.0            # softmax temperature of F^T B
backward_input: hit_spec             # B reads the eps-scaled hit-spec columns
# What the actor maximises: 'softmax' averages the reward under the predicted
# distribution; 'linear_fz' uses FB's linear readout F(s,a,z)^T z.
measure_density_actor_value: softmax
# 'mlp': one MLP per tower. 'motivo': Meta Motivo's forward/backward shapes, with the
# hidden-dims lists read as (width, n_layers), so every entry must be equal.
measure_density_archi: mlp
measure_density_b_norm: false        # project B's output onto the sqrt(d) sphere

measure_density_z: true
# Training rows: z inferred from the hit-kernel reward of the row's hindsight goal, or with
# this probability a uniform draw on the sqrt(d) sphere.
measure_density_z_rand_frac: 0.5
measure_density_z_ridge_lambda_mult: 0.01   # ridge lam = mult * tr(C) / d
measure_density_z_cov_eig_floor: 1.0e-6     # floor on C's eigenvalues, a multiple of tr(C)/d
measure_density_z_enc_tau: 0.0005           # polyak rate of B_slow, the copy of B encoding z
measure_density_z_sigma_tau: 0.005          # running-average rate of mu and C
# Next states frozen at the first update; a goal given at evaluation becomes z by
# regressing its hit-kernel reward on this pool. Must be <= batch_size.
measure_density_z_eval_pool_m: 256
measure_density_z_const_eps: 1.0e-6         # below this ||c|| the reward counts as constant
                                            # and z is the all-ones vector

# goal sampling (GCDataset) for the training goals
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
