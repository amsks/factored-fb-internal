# GCIVL critic — twin-head expectile V, no Q. Values mirror vendored gcivl.py:get_config().
# GCIVL is GCIQL minus the Q functions; the actor is AWR on a NEXT-STATE advantage, which
# this critic supplies through the seam's optional adv_fn hook (impls/critics/gcivl.py).
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.9

# dataset (GCDataset goal sampling) — same convention as critic/gciql.yaml
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true

# KNOWN MISMATCH (audit): vendored gcivl.py uses AWR alpha=10.0, but impls/configs/actor/awr.yaml
# applies alpha=3.0 to every critic and load_config merges the ACTOR last, so this file cannot
# override it. Correct for hiql (low_alpha=3.0), a >3x temperature error for gcivl. Pass
# `--override actor.alpha=10.0` to reproduce vendored GCIVL until the merge order is revisited.
