# FbForwardBilinear critic — the z-INDEXED forward family on a bilinear head.
#   Q(s,a,g) = <F(s,a, z=sg psi(g)), psi(g)> / sqrt(d)
# Objective/head scalars mirror critic/iql_bilinear.yaml; the z-forward + measure knobs
# mirror the bridge sweeps in tools/wandb_mode_shim/gciql_flow.py.
lr: 3.0e-4
batch_size: 1024
value_hidden_dims: [512, 512, 512]
layer_norm: true
discount: 0.99
tau: 0.005
expectile: 0.9

# --- z-indexed forward family ---
value_latent_dim: 512      # d; the rank of the goal bottleneck
phi_module: flat           # flat | two_tower | isfb_twin_leg  (the S1-fix enum: two_tower
                           # COMPOSES with the z-index, so B2/B4 are constructible)
objective: iql             # iql | measure | mix | isfb
project_z: false           # hard sphere-Norm z and psi onto radius sqrt(d); reaches BOTH nets
double_q: true             # false ablates the clipped double-Q to the single head q1

# --- measure family (consulted only under objective=measure/mix) ---
measure_coef: 0.0          # weight on the FB successor-measure term (>0 required by measure/mix)
measure_legs: critic       # critic (FB-faithful state-action measure) | value (state-only)
measure_scale_norm: false  # dimensionless TD terms (UNVERIFIED path)
measure_stopgrad_phi: false  # stop-grad phi so the measure gradient shapes only psi
measure_ortho_coef: 0.0    # FB orthonormality on the backward map psi(s')
measure_test_states: rho   # rho | goals  (task-norm test set; UNVERIFIED)
measure_test_rank: full    # full | task  (rank-1 projection; UNVERIFIED; needs goals)
iql_ortho_coef: 0.0        # FB ortho on the critic goal leg under the scalar IQL TD (no measure)

# --- isfb objective terms (consulted only under objective=isfb; STRUCTURAL-ONLY, unverified) ---
measure_insample: scalar_gate_hard   # scalar_gate_hard | scalar_gate_awr | coord
alpha_n: 1.0
alpha_m: 1.0
alpha_v: 1.0
awr_beta: 3.0
awr_wmax: 100.0
awr_normalize_adv: true
fb_pessimism_penalty: 0.0
goal_mask: true

# --- actor conditioning (mirrors iql_bilinear) ---
actor_cond: goal           # goal | z  (z => the actor conditions on psi(goal), width d)
actor_z_from_critic: false # D1: read the CRITIC's psi. Requires actor_cond='z' (audit S6).
actor_z_infer: false       # condition on the INFERRED z = E[r psi(s')] instead of psi(g)

# dataset (GCDataset goal sampling) — identical to critic/iql_bilinear.yaml
dataset_class: GCDataset
value_p_curgoal: 0.2
value_p_trajgoal: 0.5
value_p_randomgoal: 0.3
value_geom_sample: true
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
gc_negative: true
