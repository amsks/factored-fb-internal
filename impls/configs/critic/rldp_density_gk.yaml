# Exp A — rldp_density with density_fb's TASK INTERFACE over the LEARNED-B outcome space
# (impls/critics/rldp_density.py, `goal_kernel`). Everything except the two goal-kernel
# knobs at the bottom is critic/rldp_density.yaml verbatim: the discriminating variant for
# the density_fb (0.97) vs rldp_density (0.24) gap changes ONLY how the task reaches the
# critic — z = project_z(B(hindsight goal)) with no random mix, and q_fn's reward vector
# becomes the query-set-normalized object-coordinate kernel at those same goals. The
# learned measure (SP + ortho representation, categorical successor CE, softmax over the
# learned-B pool) is untouched.
#
# Config-only alias: --critic rldp_density_gk selects this file but builds the SAME
# RLDPDensityCritic class (impls/agents/__init__.py::CRITIC_ALIASES).
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 0.01
train_goal_ratio: 0.5
fb_pessimism_penalty: 0.0   # lattice-refused if nonzero (distribution targets are headwise)
norm_z: true
lr_f: 1.0e-4
lr_b: 1.0e-4              # the `predictor` group rides this (impls/agents/__init__.py::_LR_KEY)
lr_actor: 1.0e-4
horizon: 5
forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
predictor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2

# ── density knobs (impls/critics/rldp_density.py) ──────────────────────────── #
temp: 1.0                 # softmax temperature of the successor density (density_fb default)
actor_temp: null          # null => temp; the actor readout may flatten its own softmax (W2)
actor_q_center: true      # spec-19a lattice: FlowBC/FQL normalizer sees the CENTERED spread

# ── Exp A goal-kernel knobs ────────────────────────────────────────────────── #
goal_kernel: true                 # density_fb's task interface (object-coordinate kernel
                                  # reward at real goals); false = bit-identical rldp_density
measure_hit_spec: "19:22:0.4"     # cube-single default; "a:b:eps" blocks, comma-joined for a
                                  # conjunction — same grammar as critic/density_fb.yaml

dataset_class: WindowedDataset    # no goal sampling => hindsight goals fall back to
                                  # permuted next_observations (rldp_density.py::sample_cond)
