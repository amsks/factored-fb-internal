# DDPGBCDensityCPRActor — ddpgbc_density plus a hindsight-z-conditioned BC term
# (impls/actors/ddpgbc_density_cpr.py; 2026-08-26 humenv diagnosis). The term clones the
# dataset action ONLY on rows whose training z kept the encoded index of their own
# actor_goal (cond["_z_hindsight"], published by density_fb under measure_density_z=true) —
# the offline core of FB-CPR's per-z anchoring. Unconditional `alpha` BC stays available
# but defaults to 0 here: cloning actions under UNRELATED z's is the marginal-BC failure
# documented on ExoRL (flowbc cloning the RND explorer).
#
# Everything below cpr_alpha/q_coeff mirrors actor/ddpgbc_density.yaml; launchers override
# shapes/lr per arm exactly as they do for that actor.
lr_actor: 3.0e-4
actor:
  hidden_dims: [512, 512, 512]
  alpha: 0.0          # unconditional BC, OFF — see header
  cpr_alpha: 1.0      # weight of the hindsight-masked BC term
  q_coeff: 1.0        # weight of the critic-max term; 0.0 = pure hindsight-BC floor arm
  const_std: true
  layer_norm: false
  motivo_archi: false
  # Touati parity: noise on the ACTOR-loss action (eq. 43 / fb_ddpg dist.sample(clip)).
  # 0.0 = the noiseless mode every prior cell ran.
  q_noise_std: 0.0
  q_noise_clip: 0.3
