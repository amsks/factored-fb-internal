# FlowBC (FQL-style flow-matching) actor defaults at cube-single launch values.
# Mirrors impls/main.py:get_config()'s actor=dict(...) block exactly.
actor:
  type: flow
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  bc_coeff: 3.0
  flow_steps: 10
  lr_actor_vf: 3.0e-4
  flow_vf_hidden_dim: 512
  flow_vf_hidden_layers: 4
