# Flow-matching behaviour cloning with a one-step policy (impls/actors/flowbc.py).
lr_actor: 1.0e-4           # the one-step policy
actor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  bc_coeff: 3.0            # weight of distillation towards the flow's action
  flow_steps: 10
  lr_actor_vf: 3.0e-4      # the flow vector field
  flow_vf_hidden_dim: 512
  flow_vf_hidden_layers: 4
