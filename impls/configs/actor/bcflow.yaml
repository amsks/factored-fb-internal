# BCFlow — the pure behaviour-cloning control for flowbc.
#
# Identical to actor/flowbc.yaml in every respect except `q_coeff: 0.0`, which removes the
# critic's value term from the one-step actor objective. What remains is exactly a
# flow-matching BC policy: the vector field is trained by flow matching on the offline
# actions (as it already is under flowbc) and the one-step actor distils that flow.
#
# It is a CONTROL, not a baseline reimplementation: same networks, same optimiser, same
# conditioning vector, same data, same seeds. So `bcflow` vs `flowbc` at matched critic
# isolates one thing — whether the learned value signal improves on cloning the data. On
# expert, near-unimodal demonstrations it may well not, and that is the point of running it.
lr_actor: 1.0e-4

actor:
  type: flow
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  bc_coeff: 3.0
  q_coeff: 0.0          # <- the only difference from flowbc.yaml
  flow_steps: 10
  lr_actor_vf: 3.0e-4
  flow_vf_hidden_dim: 512
  flow_vf_hidden_layers: 4
