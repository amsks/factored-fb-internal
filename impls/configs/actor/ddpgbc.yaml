# Deterministic TD3-style actor for the ExoRL runs (impls/actors/ddpgbc.py).
lr_actor: 1.0e-4
actor:
  hidden_dims: [1024]      # (width, number of trunk layers) of the Meta Motivo actor
  q_normalize: true        # divide the Q term by mean |Q|; some domains ran it off
  q_noise_std: 0.2         # noise on the action inside the actor loss
  q_noise_clip: 0.3
  boot_noise_std: 0.2      # noise on the bootstrap action in the TD target
  boot_noise_clip: 0.3
