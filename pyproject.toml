[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factored-fb"
version = "0.1.0"
description = "Forward-Backward representations for offline goal-conditioned RL on OGBench"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "safetensors>=0.4.4",
    "h5py>=3.11.0",
    "wandb>=0.22.3",
    "tqdm",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "imageio>=2.31",
]

[tool.uv]
# Pull in rlmini_envs + Box2D on every `uv run` / `uv sync` (avoids heavy ogbench/labmaze).
default-groups = ["rlmini"]

[tool.uv.sources]
rlmini-envs = { path = "../rlmini-envs", editable = true }
# PyPI has no linux-aarch64 Box2D wheels; build from upstream source (see docs/install.md).
box2d = { git = "https://github.com/pybox2d/pybox2d.git" }

[dependency-groups]
rlmini = [
    "box2d",
    "rlmini-envs",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "buffers*", "data*", "envs*", "evals*"]

[project.optional-dependencies]
ogbench = [
    "ogbench>=1.1.2",
]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "pytest>=8.0",
    "pre-commit>=3.7",
]
slurm = [
    "hydra-submitit-launcher>=1.2",
]

[tool.black]
line-length = 100
target-version = ["py311"]
# Exclude generated/vendored files
exclude = '''
/(
    \.git
  | \.venv
  | outputs
  | multirun
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"