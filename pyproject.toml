[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factored-fb"
version = "0.1.0"
description = "Forward-Backward (FB) / GCIQL bridge representations for offline goal-conditioned RL on state-based OGBench (JAX)"
requires-python = ">=3.11"
# Runtime deps are declared in requirements.txt (ogbench is installed editable
# from the vendored source, which is awkward to express here). This list mirrors
# the third-party packages impls/ imports, for tooling that reads pyproject.
dependencies = [
    "ogbench",
    "jax",
    "flax",
    "optax",
    "numpy",
    "gymnasium",
    "distrax",
    "absl-py",
    "omegaconf",
    "wandb",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["impls*"]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | outputs
  | multirun
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
